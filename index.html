/* ============ COACH CONTENT ============ */
const RULES={
en:[["25","Twenty-five minutes, total","Attention at four is roughly two to five minutes per activity. A 25-minute practice that stays fun beats an hour that falls apart."],
 ["1","One ball each","Two kids sharing a ball means one kid touching a ball. Never let a child stand and watch another child practice."],
 ["✕","No lines, no laps, no lectures","If a child is standing in a line, the practice has stopped. If you're talking for more than fifteen seconds, so has their attention."],
 ["▶","Games, not drills","Same skill, different wrapper. 'Dribble between cones' is a drill. 'Escape the shark' is a game. They are identical and only one of them works."],
 ["♥","Nobody ever sits out","Elimination games at this age produce a crying child and a ruined practice. Redesign every game so getting caught means rejoining immediately."],
 ["!","Say every child's name often","Being seen matters more than being coached. Use names constantly, especially the quiet one."],
 ["↺","One instruction at a time","'Dribble to the cone' — not 'dribble to the cone, then turn, then pass.' Give the next instruction when the first is done."],
 ["★","End while they still want more","Stop at the peak, not the collapse. The goal of practice one is that they ask for practice two."]],
zh:[["25","总共二十五分钟","四岁孩子对每项活动的注意力大约是二到五分钟。一次全程好玩的25分钟训练，胜过一小时的兵荒马乱。"],
 ["1","每人一个球","两个孩子共用一个球，等于只有一个孩子在碰球。绝不要让一个孩子站着看另一个孩子练。"],
 ["✕","不排队、不跑圈、不训话","只要有孩子在排队，训练就已经停了。你只要讲超过十五秒，他的注意力也停了。"],
 ["▶","要游戏，不要练习","同样的技能，换个包装。“绕桶带球”是练习，“逃离鲨鱼”是游戏。内容完全一样，但只有一个管用。"],
 ["♥","永远不让人出局","这个年纪的淘汰制游戏，结果就是一个哭的孩子和一场毁掉的训练。把每个游戏都改成：被抓到就立刻重新加入。"],
 ["!","经常叫每个孩子的名字","“被看见”比“被指导”重要得多。不停地叫名字，尤其是那个最安静的孩子。"],
 ["↺","一次只给一条指令","说“带球到桶那儿” —— 而不是“带球到桶那儿，然后转身，然后传球”。第一件事做完了，再说第二件。"],
 ["★","在他还想玩的时候收","要在最高点停，不要停在崩溃点。第一次训练的唯一目标，就是让他主动要求第二次。"]],
es:[["25","Veinticinco minutos en total","La atención a los cuatro años es de dos a cinco minutos por actividad. Una práctica de 25 minutos que sigue divertida vale más que una hora que se desmorona."],
 ["1","Un balón por niño","Dos niños compartiendo un balón significa un niño tocando el balón. Nunca dejes que un niño se quede parado viendo a otro practicar."],
 ["✕","Sin filas, sin vueltas, sin sermones","Si un niño está formado en una fila, la práctica se detuvo. Si hablas más de quince segundos, su atención también."],
 ["▶","Juegos, no ejercicios","La misma habilidad con otra envoltura. 'Dribla entre los conos' es un ejercicio. 'Escapa del tiburón' es un juego. Son idénticos y solo uno funciona."],
 ["♥","Nadie se queda fuera","Los juegos de eliminación a esta edad producen un niño llorando y una práctica arruinada. Rediseña cada juego para que ser atrapado signifique volver a entrar de inmediato."],
 ["!","Di el nombre de cada niño seguido","Ser visto importa más que ser corregido. Usa los nombres constantemente, sobre todo el del más callado."],
 ["↺","Una instrucción a la vez","'Dribla hasta el cono' — no 'dribla hasta el cono, luego gira, luego pasa'. Da la siguiente instrucción cuando la primera esté hecha."],
 ["★","Termina cuando todavía quieren más","Para en el punto alto, no en el derrumbe. La meta de la práctica uno es que pidan la práctica dos."]]};

const FIXES={
en:[["A child wanders off mid-practice","Completely normal at four and not defiance. Don't chase or negotiate. Keep the game loud and fun and they'll drift back — kids return to energy. If they don't, let them watch; watching is participating at this age. Never make it a battle you have to win."],
 ["My child melts down when they lose","Then stop keeping score. At four, competition adds nothing and costs a lot. Make outcomes shared: 'we scored six goals as a team.' Reintroduce winning around six or seven when they can handle it."],
 ["One kid dominates and the others fade","Give the strong one a job — 'you're my assistant coach this game' — or a handicap they'll find funny, like using only their weak foot. Never frame it as a fairness problem in front of the group."],
 ["Nobody is listening to me","You're probably talking too long. Cut every explanation to one sentence and demonstrate instead. Get low, get their eyes, use names. If the group has genuinely gone, switch to the finishing game and end early on a good note."],
 ["They want to quit halfway through","Ask if they want to do one more fun thing and then be done — offer the finishing game. Nearly always they'll do it and leave happy. Forcing a four-year-old to finish teaches them the sport is something to endure."],
 ["We missed two weeks. Do we restart?","No. Repeat the last week you did and carry on. The season is a ladder, not a schedule — nothing breaks if a rung takes a fortnight."],
 ["They're ahead of the plan. Skip forward?","Only if they're clearing the weekly milestone easily and asking for harder. Boredom is a real risk too. Better move is to keep the week and use the 'too easy' variation on each station."],
 ["Is the ladder and hurdle stuff actually useful?","At four, yes — but as movement play, not athletic training. Jumping, hopping and stepping patterns build the gross-motor control every sport sits on top of. What is not useful is timing them, ranking them, or treating it as speed work."],
 ["My child is fine but their friend is shy","Don't spotlight them. Give a parallel task beside the group rather than in front of it, and let them join when ready. Two or three sessions watching from the edge is a normal on-ramp."]],
zh:[["有孩子练到一半跑掉了","四岁孩子这样完全正常，不是不听话。别去追，也别去讲条件。把游戏搞得又响又好玩，孩子自己会晃回来 —— 孩子会往有能量的地方走。如果他不回来，就让孩子在旁边看；这个年纪，看着也算参与。千万别把这变成一场你非赢不可的较量。"],
 ["我的孩子一输就崩溃","那就别计分。四岁玩竞争没有任何好处，代价却很大。把结果说成共同的：“我们一队一共进了六个球。”等六七岁能承受了再把输赢放回来。"],
 ["有个孩子太强，其他人就不玩了","给那个强的孩子安排个任务 —— “这局你当我的助理教练” —— 或者给孩子一个孩子自己也觉得好笑的限制，比如只能用不顺的那只脚。千万别当着大家的面把这说成“公平问题”。"],
 ["没人听我说话","多半是你讲太久了。把每个解释压缩成一句话，剩下的用示范。蹲下来、和他对上眼、叫名字。如果这群孩子是真的散了，就直接切到收尾游戏，提前在一个好气氛里结束。"],
 ["孩子练到一半就想不练了","问孩子要不要再玩一个好玩的然后就结束 —— 把收尾游戏拿出来。几乎每次他都会玩，而且是高高兴兴走的。强迫四岁孩子练完，只会让孩子觉得这项运动是要忍耐的东西。"],
 ["我们中间断了两周，要重头开始吗？","不用。把上次做的那一周再做一遍，然后继续往下走。这个赛季是一架梯子，不是一张时间表 —— 某一级台阶花了两周，什么都不会坏。"],
 ["孩子进度超前了，可以跳过去吗？","只有当孩子很轻松就达到本周目标、而且主动要求更难的时候才跳。无聊也是真实的风险。更好的做法是留在这一周，但每个环节都用“太简单了”那一档的加难版本。"],
 ["敏捷梯和跨栏这些真的有用吗？","四岁的话，有用 —— 但要当成体能游戏，不是运动训练。跳跃、单脚跳、踩点这些动作，练的是所有运动都建立在上面的大肌肉控制能力。没用的是给他们计时、排名次，或者当成速度训练来练。"],
 ["我的孩子没问题，但他的小伙伴很害羞","别把注意力聚到他身上。给他安排一个在旁边同时进行的任务，而不是在大家面前表演的任务，等他准备好了自然会加入。在边上看两三次课，是很正常的过渡。"]],
es:[["Un niño se va a media práctica","Completamente normal a los cuatro y no es rebeldía. No lo persigas ni negocies. Mantén el juego ruidoso y divertido y regresará solo — los niños vuelven hacia donde hay energía. Si no vuelve, déjalo mirar; mirar es participar a esta edad. Nunca lo conviertas en una batalla que tengas que ganar."],
 ["Mi hijo o hija colapsa cuando pierde","Entonces deja de llevar marcador. A los cuatro, la competencia no aporta nada y cuesta mucho. Haz los resultados compartidos: 'anotamos seis goles como equipo'. Reintroduce el ganar alrededor de los seis o siete, cuando ya lo puedan manejar."],
 ["Un niño domina y los demás se apagan","Dale al fuerte una tarea — 'este partido eres mi entrenador asistente' — o una desventaja que le parezca chistosa, como usar solo el pie malo. Nunca lo plantees como un problema de justicia frente al grupo."],
 ["Nadie me hace caso","Probablemente hablas demasiado. Reduce cada explicación a una frase y demuestra en vez de explicar. Agáchate, busca sus ojos, usa los nombres. Si el grupo ya se fue de verdad, pasa al juego de cierre y termina temprano en buen momento."],
 ["Quiere dejarlo a la mitad","Pregúntale si quiere hacer una cosa divertida más y ya — ofrécele el juego de cierre. Casi siempre lo harán y se irán contentos. Obligar a un niño de cuatro a terminar le enseña que el deporte es algo que hay que aguantar."],
 ["Nos saltamos dos semanas. ¿Reiniciamos?","No. Repite la última semana que hicieron y sigan. La temporada es una escalera, no un calendario — no se rompe nada si un escalón toma quince días."],
 ["Va adelantado. ¿Nos saltamos semanas?","Solo si supera la meta semanal con facilidad y pide más dificultad. El aburrimiento también es un riesgo real. Mejor quédate en la semana y usa la variante '¿Muy fácil?' de cada estación."],
 ["¿La escalera y las vallas sirven de algo?","A los cuatro, sí — pero como juego de movimiento, no como entrenamiento atlético. Saltar y los patrones de pisada construyen el control motor grueso sobre el que se apoya todo deporte. Lo que no sirve es cronometrarlos, rankearlos o tratarlo como trabajo de velocidad."],
 ["Mi hijo o hija está bien pero su amigo es tímido","No lo pongas en el centro. Dale una tarea paralela junto al grupo en vez de frente al grupo, y déjalo entrar cuando esté listo. Dos o tres sesiones mirando desde la orilla es una rampa de entrada normal."]]};

const dl=d=>d[lang]||d.en;

/* Storage: uses the browser's localStorage when hosted on a normal website,
   falls back to Claude's storage API, and finally to memory-only. */
const STORE=(()=>{
  try{
    const k="__bc_test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k);
    return {get:k=>{const v=localStorage.getItem(k); return v==null?null:{value:v};},
            set:(k,v)=>localStorage.setItem(k,v)};
  }catch(e){}
  if(typeof window!=="undefined" && window.storage){
    return {get:async k=>{try{return await window.storage.get(k);}catch(e){return null;}},
            set:async (k,v)=>{try{await window.storage.set(k,v);}catch(e){}}};
  }
  return {get:()=>null,set:()=>{}};
})();
async function loadAll(){
  try{
    const a=await STORE.get("bc3:checks"); if(a&&a.value) Object.assign(checked,JSON.parse(a.value));
    const b=await STORE.get("bc3:done");   if(b&&b.value) Object.assign(done,JSON.parse(b.value));
    const c=await STORE.get("bc3:week");   if(c&&c.value) Object.assign(curWeek,JSON.parse(c.value));
    const d=await STORE.get("bc3:prefs");  if(d&&d.value){const o=JSON.parse(d.value); lang=o.lang||"en"; kit=!!o.kit;}
  }catch(e){}
}
async function save(k,o){ try{ await STORE.set(k,JSON.stringify(o)); }catch(e){} }
const savePrefs=()=>save("bc3:prefs",{lang,kit});

/* ============ SEASON ============ */
function renderSeason(){
  const L=t(), S=SPORTS[sport], wks=SEASON[sport];
  document.getElementById("seasonBlurb").textContent=dl(S).seasonBlurb;
  const comp=wks.reduce((a,_,i)=>a+(done[key(i+1,"a")]?1:0)+(done[key(i+1,"b")]?1:0),0);
  document.getElementById("seasonMeta").textContent=comp+" / "+(wks.length*2)+" "+L.sessions;
  let html="";
  L.phases.forEach((ph,pi)=>{
    html+=`<div class="phase"><div class="phasehead"><h3>${ph[1]}</h3><span>${ph[0]}</span></div>`;
    wks.forEach((w,i)=>{
      if(w.ph!==pi) return;
      const n=i+1, cur=curWeek[sport]===n, W=dl(w);
      html+=`<button class="card wk" data-w="${n}" data-cur="${cur?1:0}">
        <div class="wn"><b>${n}</b><span>${L.week}</span></div>
        <div class="wb"><h4>${W.t}</h4><p>${W.f}</p></div>
        <div class="wr"><span class="sdot ${done[key(n,"a")]?"on":""}">${done[key(n,"a")]?"✓":""}</span>
        <span class="sdot ${done[key(n,"b")]?"on":""}">${done[key(n,"b")]?"✓":""}</span></div></button>`;
    });
    html+=`</div>`;
  });
  document.getElementById("seasonList").innerHTML=html;
  document.querySelectorAll(".wk").forEach(b=>b.onclick=async()=>{
    curWeek[sport]=+b.dataset.w; await save("bc3:week",curWeek);
    renderSeason(); buildPlan(); renderPlan(); go("practice");
  });
}

/* ============ PLAN ============ */
function buildPlan(){
  week=curWeek[sport];
  const w=SEASON[sport][week-1];
  const ids=(ab==="a"?w.a:w.b).slice();
  plan=ids.map(id=>({...D[id],id}));
  if(kit){
    const mk=["m1","m2","m3","m4","m5"];
    const pick=mk[(week-1)%mk.length];
    if(plan.length&&plan[0].tag==="warm") plan[0]={...D[pick],id:pick};
    else plan.unshift({...D[pick],id:pick});
    if(week%6===0){ const o={...D.m5,id:"m5"}; if(!plan.some(x=>x.id==="m5")) plan.splice(1,0,o); }
  }
}
function renderPlan(){
  const L=t(), w=SEASON[sport][week-1], W=dl(w);
  document.getElementById("planTitle").textContent=(lang==="zh"?`第${week}周 · ${W.t}`:`${L.week} ${week} · ${W.t}`);
  const total=plan.reduce((a,d)=>a+d.min,0);
  document.getElementById("planMeta").textContent=`${total} ${L.min} · ${plan.length} ${L.stations}`;
  document.getElementById("planFocus").textContent=W.f;
  document.getElementById("planMile").textContent=W.m;
  document.getElementById("planList").innerHTML=plan.map((d,D2)=>{
    const x=dl(d);
    return `<button class="card drill" data-i="${D2}">
      <div class="num"><b>${D2+1}</b><span>${d.min} ${L.min}</span></div>
      <div class="body"><span class="tag">${L.tags[d.tag]}</span>${
        d.kit?`<span class="tag kit">${L.kitTag}</span>`:""}${
        w.nw.includes(d.id)?`<span class="tag new">${L.newWk}</span>`:""}
        <h3>${x.n}</h3><p>${x.how}</p></div></button>`;
  }).join("");
  document.querySelectorAll(".drill").forEach(b=>b.onclick=()=>openDetail(+b.dataset.i));
  const isDone=!!done[key(week,ab)], db=document.getElementById("doneBtn");
  db.textContent=isDone?L.undone:L.markDone;
  db.style.color=isDone?"var(--accent)":"";
}
function openDetail(i){
  const L=t(), d=plan[i], x=dl(d);
  document.getElementById("dTitle").textContent=x.n;
  document.getElementById("dBody").innerHTML=`
    <div class="dsec"><span class="tag">${L.tags[d.tag]}</span> <span class="tag">${d.min} ${L.minutes}</span></div>
    <div class="dsec"><h4>${L.setUp}</h4><p>${x.setup}</p></div>
    <div class="dsec"><h4>${L.howWorks}</h4><p>${x.how}</p></div>
    <div class="dsec cue"><h4>${L.sayThis}</h4><p>“${x.cue}”</p></div>
    <div class="dsec adj"><div><h5>${L.tooHard}</h5><p>${x.e}</p></div><div><h5>${L.tooEasy}</h5><p>${x.h}</p></div></div>`;
  document.getElementById("detail").classList.add("on");
}
document.getElementById("detailX").onclick=()=>document.getElementById("detail").classList.remove("on");
document.querySelectorAll("#abrow button").forEach(b=>b.onclick=()=>{
  ab=b.dataset.ab;
  document.querySelectorAll("#abrow button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  buildPlan(); renderPlan();
});
document.getElementById("kitToggle").onclick=async()=>{
  kit=!kit; document.getElementById("kitToggle").setAttribute("aria-pressed",kit);
  await savePrefs(); buildPlan(); renderPlan();
};
document.getElementById("doneBtn").onclick=async()=>{
  const k=key(week,ab); done[k]=!done[k]; await save("bc3:done",done);
  renderPlan(); renderSeason();
};

/* ============ GEAR ============ */
function renderGear(){
  const L=t(), S=SPORTS[sport];
  document.getElementById("gearTitle").textContent=dl(S).name+" "+L.gearH;
  document.getElementById("gearBlurb").textContent=dl(S).gearBlurb;
  const tiers=[...S.gear,KIT];
  let html="";
  tiers.forEach((tier,ti)=>{
    html+=`<div class="tierhead"><h3>${L.tiers[ti]}</h3><span>${tier.length} ${L.items}</span></div><div class="card">`;
    tier.forEach(it=>{
      const x=dl(it), k=sport+"|"+x.n, on=!!checked[k];
      html+=`<button class="gear" data-k="${k}" data-p="${it.p}" aria-pressed="${on}">
        <span class="gimg">${IC[it.ic]||IC.ball}</span>
        <span class="gtxt"><span class="gname">${x.n}</span><span class="gwhy">${x.w}</span><span class="gprice">${it.p}</span></span>
        <span class="box">${on?"✓":""}</span></button>`;
    });
    html+=`</div>`;
  });
  document.getElementById("gearList").innerHTML=html;
  document.getElementById("skipList").innerHTML=S.skip[lang].map(([a,b])=>`<li><b>${a}.</b> ${b}</li>`).join("");
  document.querySelectorAll(".gear").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.k; checked[k]=!checked[k];
    b.setAttribute("aria-pressed",checked[k]);
    b.querySelector(".box").textContent=checked[k]?"✓":"";
    updateBudget(); await save("bc3:checks",checked);
  });
  updateBudget();
}
function updateBudget(){
  let lo=0,hi=0;
  document.querySelectorAll(".gear").forEach(b=>{
    if(b.getAttribute("aria-pressed")!=="true") return;
    const m=b.dataset.p.match(/\d+/g); if(!m) return;
    lo+=+m[0]; hi+=m[1]?+m[1]:+m[0];
  });
  document.getElementById("budgetNum").textContent=lo===0?"$0":(lo===hi?`$${lo}`:`$${lo}–${hi}`);
}

/* ============ RUN MODE ============ */
function startRun(){ idx=0; loadStation(); document.getElementById("run").classList.add("on"); }
function loadStation(){
  if(idx>=plan.length){ finishRun(); return; }
  const L=t(), d=plan[idx], x=dl(d);
  remain=d.min*60; running=true;
  document.getElementById("runDots").innerHTML=plan.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join("");
  const head = lang==="zh"
    ? `第${week}周 · 第${idx+1}／共${plan.length}个环节 · ${L.tags[d.tag]}`
    : `${L.week} ${week} · ${L.station} ${idx+1} ${L.of} ${plan.length} · ${L.tags[d.tag]}`;
  document.getElementById("runBody").innerHTML=`
    <div class="runtag">${head}</div><h2>${x.n}</h2><div class="clock" id="clock">--:--</div>
    <div class="runhow"><b>${L.setUp}:</b> ${x.setup}<br><br>${x.how}</div>
    <div class="runcue">“${x.cue}”</div>
    <div class="runctl"><button class="ghost" id="pauseB">${L.pause}</button>
    <button id="nextB">${idx===plan.length-1?L.finishB:L.next}</button></div>`;
  document.getElementById("pauseB").onclick=togglePause;
  document.getElementById("nextB").onclick=()=>{idx++;loadStation();};
  paint(); clearInterval(tick);
  tick=setInterval(()=>{ if(running&&remain>0){remain--;paint();} },1000);
}
function paint(){
  const c=document.getElementById("clock"); if(!c) return;
  c.textContent=Math.floor(remain/60)+":"+String(remain%60).padStart(2,"0");
  c.classList.toggle("done",remain===0);
}
function togglePause(){ running=!running; document.getElementById("pauseB").textContent=running?t().pause:t().resume; }
function finishRun(){
  clearInterval(tick);
  const L=t(), W=dl(SEASON[sport][week-1]);
  document.getElementById("runBody").innerHTML=`
    <div class="finish"><div class="big">🙌</div><h2>${L.doneH}</h2>
      <p style="opacity:.92;font-size:17px;max-width:360px;margin:0 auto 18px">${L.doneP}</p>
      <p style="opacity:.85;font-size:15.5px;max-width:360px;margin:0 auto 26px"><b>${L.thisMile}</b> ${W.m}</p>
      <div class="runctl"><button class="ghost" id="markB">${L.markB}</button>
      <button id="doneB2">${L.backB}</button></div></div>`;
  document.getElementById("doneB2").onclick=quitRun;
  document.getElementById("markB").onclick=async()=>{
    done[key(week,ab)]=true; await save("bc3:done",done);
    renderPlan(); renderSeason(); quitRun();
  };
  document.getElementById("runDots").innerHTML=plan.map(()=>`<i class="on"></i>`).join("");
}
function quitRun(){ clearInterval(tick); running=false; document.getElementById("run").classList.remove("on"); }
document.getElementById("runQuit").onclick=quitRun;
document.getElementById("runSkip").onclick=()=>{idx++;loadStation();};
document.getElementById("startBtn").onclick=startRun;

/* ============ NAV ============ */
function go(tb){
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.t===tb));
  ["basics","season","practice","gear","coach"].forEach(s2=>
    document.getElementById("tab-"+s2).classList.toggle("hide",s2!==tb));
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
document.querySelectorAll("#sportsw button").forEach(b=>b.onclick=()=>{
  sport=b.dataset.s; document.body.dataset.sport=sport; ab="a";
  document.querySelectorAll("#sportsw button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.querySelectorAll("#abrow button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.ab==="a"));
  renderAll(); window.scrollTo(0,0);
});
document.querySelectorAll("#langsw button").forEach(b=>b.onclick=async()=>{
  lang=b.dataset.l; await savePrefs(); renderAll();
});
function renderAll(){ paintChrome(); renderBasics(); renderSeason(); buildPlan(); renderPlan(); renderGear(); }

const FIG={
soccerField:F=>`<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">${DEFS}
 <rect class="fld" x="30" y="20" width="340" height="200" rx="3"/>
 <rect class="ln" x="30" y="20" width="340" height="200" rx="3"/>

soccer:{
 fig:"soccerField", fig2:"soccerSwarm",
 en:{one:"Two teams try to kick a ball into the other team's goal. Nobody except the goalkeeper may use their hands. The team with more goals wins. That is genuinely the whole sport — soccer's rules are the simplest of the three.",
  labels:{goal:"GOAL",half:"halfway line",attack:"your team attacks this way",swarmA:"the ball",swarmB:"the one kid picking daisies"},
  cap:"A full-size pitch. Your backyard version is the same shape, just much smaller — two goals, and everything happens in between them.",
  cap2:"What a real under-6 game looks like: every child in one clump around the ball, and one child somewhere else entirely. This is normal and you should not try to fix it.",
  game:"The ball starts in the middle. Both teams chase it. When it goes over a side line, the other team throws it back in with two hands over their head. When it goes over an end line, play restarts with a kick. There are two halves with a break in between. At age four, games are usually 4-a-side or smaller, often with no goalkeeper, and nobody keeps score.",
  score:"One point — a goal — every time the whole ball crosses the goal line between the posts. That's it. There is no other way to score.",
  rules:[["No hands","Only the goalkeeper may touch the ball with hands or arms, and only inside their own box. At age four there is often no goalkeeper at all, which removes the exception entirely."],
   ["Throw-in","Ball off the side of the field: the other team throws it back in, two hands, over the head, both feet on the ground. Many youth leagues allow a kick-in instead because the throw is hard for small children."],
   ["Corner and goal kick","Ball off the end line: if the defending team touched it last, the attacking team gets a corner kick. If the attacking team touched it last, the defending team kicks from their box."],
   ["Offside — ignore it","Real soccer has an offside rule to stop players camping by the goal. It is not used in under-6 soccer and you should not try to teach it. Mentioning it now only causes confusion."],
   ["Fouls","Pushing, tripping, holding. At this age the referee — you — just says 'careful' and restarts. Never call a foul on a four-year-old with a serious face."]],
  words:[["Dribble","Running while keeping the ball at your feet with small touches."],["Pass","Kicking the ball to a teammate on purpose."],["Shot","A kick aimed at the goal."],["Goalkeeper","The one player allowed to use hands, inside their own box."],["Throw-in","Two-handed throw from the sideline to restart play."],["Half","One of the two periods of a game."],["Pitch","The field. British word you'll hear often in soccer."],["Touch","One contact between foot and ball."]],
  age4:"Expect a swarm. Every child will run at the ball together, nobody will pass, and at least one will be looking at a plane. Positions, passing and tactics are years away — the entire goal at four is that the child ends up touching the ball a lot and wants to come back next week."},
 zh:{one:"两队互相把球踢进对方的球门。除了守门员，谁都不能用手。进球多的一队赢。真的就这么简单 —— 三项运动里，足球的规则是最简单的。",
  labels:{goal:"球门",half:"中线",attack:"你的队往这边进攻",swarmA:"球在这里",swarmB:"那个在发呆的孩子"},
  cap:"这是标准球场。你家院子里的版本形状一样，只是小得多 —— 两个球门，所有事情都发生在中间。",
  cap2:"六岁以下的真实比赛就是这样：所有孩子挤成一团围着球，另外有一个孩子在完全不相干的地方。这很正常，别去纠正。",
  game:"球从中间开出，两队一起去抢。球出了边线，由对方用双手从头顶把球扔回场内。球出了底线，用踢球的方式重新开始。比赛分上下半场，中间休息。四岁的比赛通常是四人制或更少，往往连守门员都没有，而且不记分。",
  score:"整个球完全越过两根门柱之间的球门线，就是一分（一个进球）。就这一种得分方式，没有别的。",
  rules:[["不能用手","只有守门员可以用手或手臂碰球，而且只能在自己的禁区内。四岁的比赛经常根本没有守门员，那这条例外就完全不存在了。"],
   ["界外球","球出了边线：由对方双手过头把球扔回场内，双脚要着地。很多青少年联赛允许改成脚踢，因为这个扔球动作对小孩子来说很难。"],
   ["角球和球门球","球出了底线：如果最后碰球的是防守方，进攻方获得角球；如果最后碰球的是进攻方，防守方从自己禁区内开球。"],
   ["越位 —— 忽略它","正式足球有越位规则，是为了防止球员一直守在球门口。六岁以下的比赛不使用这条规则，你也不要试图去教。现在提它只会造成混乱。"],
   ["犯规","推人、绊人、拉扯。这个年纪，裁判（也就是你）只要说一句“小心点”然后重新开球就行。永远不要板着脸对一个四岁孩子判犯规。"]],
  words:[["带球","一边跑一边用小幅触球把球控制在脚下。"],["传球","有意识地把球踢给队友。"],["射门","朝球门踢出的一脚。"],["守门员","唯一允许在自己禁区内用手的球员。"],["界外球","从边线双手把球扔回场内，重新开始比赛。"],["半场","比赛两个时段中的一个。"],["球场","足球场。"],["触球","脚和球的一次接触。"]],
  age4:"你会看到一群孩子挤在一起。所有人一起冲向球，没有人会传球，至少有一个在抬头看飞机。位置、传球、战术都是好几年以后的事 —— 四岁阶段唯一的目标，就是让孩子多碰到球，并且下周还想再来。"},
 es:{one:"Dos equipos intentan meter el balón en la portería del otro. Nadie excepto el portero puede usar las manos. Gana el equipo con más goles. Ese es literalmente todo el deporte — las reglas del fútbol son las más simples de los tres.",
  labels:{goal:"PORTERÍA",half:"línea de medio campo",attack:"tu equipo ataca hacia acá",swarmA:"el balón",swarmB:"el niño distraído"},
  cap:"Una cancha de tamaño completo. Tu versión de patio tiene la misma forma, solo mucho más chica — dos porterías, y todo pasa entre ellas.",
  cap2:"Así se ve un partido real de menores de 6: todos los niños en bola alrededor del balón, y uno completamente en otro lado. Es normal y no deberías intentar corregirlo.",
  game:"El balón empieza en el centro. Ambos equipos lo persiguen. Cuando sale por una línea lateral, el otro equipo lo devuelve con las dos manos por encima de la cabeza. Cuando sale por la línea de fondo, se reanuda con un tiro. Hay dos tiempos con descanso. A los cuatro años se juega 4 contra 4 o menos, muchas veces sin portero, y nadie lleva el marcador.",
  score:"Un punto — un gol — cada vez que el balón completo cruza la línea de meta entre los postes. Ya. No hay otra forma de anotar.",
  rules:[["Sin manos","Solo el portero puede tocar el balón con manos o brazos, y solo dentro de su área. A los cuatro años muchas veces no hay portero, lo que elimina la excepción por completo."],
   ["Saque de banda","Balón fuera por el lateral: el otro equipo lo lanza con las dos manos por encima de la cabeza y los dos pies en el suelo. Muchas ligas infantiles permiten un saque con el pie porque el lanzamiento es difícil para niños pequeños."],
   ["Tiro de esquina y saque de meta","Balón fuera por la línea de fondo: si lo tocó por último la defensa, hay tiro de esquina para el ataque. Si lo tocó por último el ataque, la defensa saca desde su área."],
   ["Fuera de juego — ignóralo","El fútbol real tiene la regla de fuera de juego para evitar que los jugadores se planten junto a la portería. No se usa en menores de 6 y no deberías intentar enseñarla. Mencionarla ahora solo causa confusión."],
   ["Faltas","Empujar, zancadillear, agarrar. A esta edad el árbitro — tú — solo dice 'cuidado' y reanuda. Nunca marques una falta a un niño de cuatro con cara seria."]],
  words:[["Driblar","Correr manteniendo el balón en los pies con toques pequeños."],["Pase","Patear el balón a un compañero a propósito."],["Tiro","Un disparo dirigido a la portería."],["Portero","El único jugador que puede usar las manos, dentro de su área."],["Saque de banda","Lanzamiento con dos manos desde el lateral para reanudar."],["Tiempo","Cada uno de los dos periodos del partido."],["Cancha","El campo de juego."],["Toque","Un contacto entre el pie y el balón."]],
  age4:"Espera un enjambre. Todos correrán hacia el balón juntos, nadie pasará, y al menos uno estará mirando un avión. Las posiciones, los pases y la táctica están a años de distancia — la única meta a los cuatro es que el niño toque el balón muchas veces y quiera volver la próxima semana."}},

baseball:{
 fig:"baseDiamond", fig2:"baseRun",
 en:{one:"One team bats, the other fields. A batter hits the ball and then runs around four bases in order. Getting all the way back to where you started scores a point. In t-ball there is no pitcher at all — the ball sits still on a stand, which is why it's where every child begins.",
  labels:{home:"HOME PLATE",first:"1st",second:"2nd",third:"3rd",mound:"pitcher",ez:"",s1:"hit",s2:"1st",s3:"2nd",s4:"3rd → home",runNote:"always run this way — never backwards",attack:""},
  cap:"The diamond. The batter stands at home plate, hits, then runs the bases in the direction of the arrows — always counter-clockwise. The curved line is the outfield boundary.",
  cap2:"The batting sequence. Hit the ball, then run to first. Keep going if you can. Touching home again after all four is one run.",
  game:"Teams take turns batting. When your team bats, each child hits and tries to reach a base safely. When your team fields, you try to catch or field the ball and get it to a base before the runner. After a set number of batters — or after everyone has batted, in t-ball — the teams swap. A round of both teams batting is called an inning.",
  score:"A run is scored when a player touches all four bases in order and gets back to home plate. Most runs at the end wins. In t-ball, scores usually aren't kept at all.",
  rules:[["The tee replaces the pitcher","In t-ball the ball rests on an adjustable stand. Nobody throws it. This removes the hardest skill in baseball — hitting a moving ball — so that a four-year-old can succeed on the very first swing."],
   ["Run counter-clockwise","First base is to the batter's right. Then second, then third, then home. Running the wrong way is the single most common four-year-old mistake and is always funny."],
   ["An out","A fielder catches the ball in the air, or touches the base before the runner gets there. Three outs and the teams swap. In most t-ball, outs are not enforced and everybody bats every round."],
   ["Foul ball","A ball hit outside the two lines running out from home plate. It doesn't count as a hit. At this age just let them re-hit it."],
   ["Drop the bat","The single most important safety rule. Children swing and then run while still holding the bat. Teach 'drop it' from day one, every single time."]],
  words:[["At bat","Your turn to hit."],["Tee","The stand the ball sits on."],["Base","One of the four corners the runner must touch."],["Run","One point, scored by getting all the way home."],["Out","A way of ending a batter or runner's turn."],["Inning","One round of both teams batting."],["Fielder","A player on the team that isn't batting."],["Grounder","A ball hit along the ground."]],
  age4:"Expect swings that miss a stationary ball, runs to third base instead of first, and every fielder chasing the same ball at once. Nobody will stay in a position. The wins at this age are: hit the ball off the tee, drop the bat, and run in roughly the right direction."},
 zh:{one:"一队击球，另一队防守。击球员把球打出去，然后按顺序绕四个垒跑。跑回出发的地方就得一分。T-ball（棒球启蒙）根本没有投手 —— 球是静止放在架子上的，所以所有孩子都从这里开始。",
  labels:{home:"本垒",first:"一垒",second:"二垒",third:"三垒",mound:"投手丘",ez:"",s1:"击球",s2:"一垒",s3:"二垒",s4:"三垒→本垒",runNote:"永远往这个方向跑 —— 不能倒着跑",attack:""},
  cap:"这就是“棒球菱形”。击球员站在本垒击球，然后按箭头方向跑垒 —— 永远是逆时针。弧线是外野的边界。",
  cap2:"击球到得分的顺序：打中球，跑向一垒，能继续就继续。四个垒都踩过再回到本垒，算一分。",
  game:"两队轮流击球。轮到你的队击球时，每个孩子都上场打，尽量安全跑上垒。轮到防守时，要接住球或捡起球，赶在跑垒员之前把球送到垒上。打满一定人数后 —— T-ball里通常是所有人都打过一轮 —— 两队交换。两队各打一轮叫做一“局”。",
  score:"一名球员按顺序踩过四个垒并回到本垒，就得一分。最后得分多的队赢。不过T-ball阶段通常根本不计分。",
  rules:[["打击架代替投手","T-ball里球放在一个可调高度的架子上，没有人投球。这就去掉了棒球里最难的一项技能 —— 打移动中的球 —— 让四岁孩子第一次挥棒就有可能成功。"],
   ["逆时针跑垒","一垒在击球员的右手边，然后二垒、三垒、本垒。跑错方向是四岁孩子最常见的错误，而且每次都很好笑。"],
   ["出局","防守方在空中接住球，或者在跑垒员到达之前先碰到垒。三人出局就交换攻守。不过大多数T-ball根本不执行出局，每一轮所有人都能打。"],
   ["界外球","打到本垒两侧那两条线以外的球，不算有效击球。这个年纪就让他重打一次。"],
   ["把棒子丢掉","这是最重要的一条安全规则。孩子挥完棒经常会拿着棒子就跑。从第一天起就教“丢掉”，每一次都要教。"]],
  words:[["打席","轮到你击球。"],["打击架","放球的架子。"],["垒","跑垒员必须踩到的四个角之一。"],["得分","跑回本垒得到的一分。"],["出局","结束一名击球员或跑垒员回合的方式。"],["局","两队各击球一轮。"],["野手","防守方的球员。"],["地滚球","沿着地面滚过去的击球。"]],
  age4:"你会看到：对着静止的球挥空、跑向三垒而不是一垒、所有防守球员一起追同一个球。没有人会待在自己的位置上。这个年纪的“成功”只有三件事：把架子上的球打出去、把棒子丢掉、往大致正确的方向跑。"},
 es:{one:"Un equipo batea y el otro fildea. El bateador golpea la pelota y luego corre alrededor de cuatro bases en orden. Regresar hasta donde empezó anota un punto. En t-ball no hay lanzador — la pelota está quieta sobre un soporte, y por eso es donde empiezan todos los niños.",
  labels:{home:"HOME",first:"1ª",second:"2ª",third:"3ª",mound:"lanzador",ez:"",s1:"batea",s2:"1ª",s3:"2ª",s4:"3ª → home",runNote:"corre siempre en este sentido — nunca al revés",attack:""},
  cap:"El diamante. El bateador se para en home, batea y corre las bases en el sentido de las flechas — siempre en contra de las manecillas del reloj. La línea curva es el límite del jardín.",
  cap2:"La secuencia del bateo. Golpea la pelota y corre a primera. Sigue si puedes. Tocar home otra vez después de las cuatro es una carrera.",
  game:"Los equipos se turnan para batear. Cuando tu equipo batea, cada niño golpea e intenta llegar salvo a una base. Cuando fildeas, intentas atrapar la pelota y llevarla a una base antes que el corredor. Después de cierto número de bateadores — o de que todos batearon, en t-ball — los equipos cambian. Una ronda de ambos equipos bateando se llama entrada.",
  score:"Se anota una carrera cuando un jugador toca las cuatro bases en orden y regresa a home. Gana quien tenga más carreras. En t-ball normalmente no se lleva marcador.",
  rules:[["El tee reemplaza al lanzador","En t-ball la pelota descansa sobre un soporte ajustable. Nadie la lanza. Esto elimina la habilidad más difícil del béisbol — batear una pelota en movimiento — para que un niño de cuatro tenga éxito desde el primer swing."],
   ["Corre en contra de las manecillas","Primera base está a la derecha del bateador. Luego segunda, tercera y home. Correr al revés es el error más común a los cuatro años y siempre es gracioso."],
   ["Un out","Un fildeador atrapa la pelota en el aire, o toca la base antes que el corredor. Tres outs y cambian los equipos. En la mayoría del t-ball no se aplican outs y todos batean cada ronda."],
   ["Foul","Una pelota bateada fuera de las dos líneas que salen desde home. No cuenta como hit. A esta edad simplemente déjalos batear de nuevo."],
   ["Suelta el bate","La regla de seguridad más importante. Los niños batean y corren todavía con el bate en la mano. Enseña 'suéltalo' desde el primer día, siempre."]],
  words:[["Turno al bate","Tu turno de batear."],["Tee","El soporte donde descansa la pelota."],["Base","Una de las cuatro esquinas que el corredor debe tocar."],["Carrera","Un punto, anotado al llegar de vuelta a home."],["Out","Una forma de terminar el turno de un bateador o corredor."],["Entrada","Una ronda de ambos equipos bateando."],["Fildeador","Un jugador del equipo que no batea."],["Roletazo","Una pelota bateada por el suelo."]],
  age4:"Espera swings que fallan una pelota quieta, carreras hacia tercera en vez de primera, y todos los fildeadores persiguiendo la misma pelota. Nadie se quedará en su posición. Los logros a esta edad son: pegarle a la pelota en el tee, soltar el bate y correr más o menos en la dirección correcta."}},

football:{
 fig:"fbField", fig2:"fbPlay",
 en:{one:"One team has the ball and tries to carry or throw it into the far end of the field. The other team tries to stop them. In flag football — the only version a four-year-old should play — you stop someone by pulling a fabric flag off their belt instead of tackling them. There is no contact at all.",
  labels:{ez:"END ZONE",attack:"the offense moves this way",p1:"passer",p2:"runner",p3:"flag pulled = play over"},
  cap:"The field. The shaded strips at each end are the end zones. The team with the ball is trying to reach the far one; the yard lines just measure how far they've come.",
  cap2:"One play, start to finish. The ball is handed to a runner, the runner heads for the end zone, and the play ends the moment a defender pulls the flag from their belt.",
  game:"One team is on offense — they have the ball. Play stops and restarts constantly: each attempt is called a down, and the offense gets four downs to advance the ball a set distance. If they make it, they get four more. If they don't, the other team takes over. Every play begins with the ball being handed backwards to start it, and ends when the ball carrier's flag is pulled or they cross the line.",
  score:"A touchdown — six points — when a player carries the ball into the end zone or catches it there. Youth flag games usually skip the extra kick afterwards and simply count touchdowns.",
  rules:[["Pulling a flag is a tackle","Every player wears a belt with two fabric flags. Pull one off and the play stops immediately. No grabbing, holding, pushing or tackling. This is the rule the whole youth game is built on."],
   ["No contact at all","No blocking with the hands, no shoulder into a runner, no diving at legs. If it involves bodies colliding, it isn't in this version of the game — and no four-year-old should be wearing pads or a helmet."],
   ["Downs","Four attempts to move the ball a set distance. This is the one rule that confuses new parents most. At age four it is usually dropped entirely: every child gets a turn carrying and every play ends in a touchdown."],
   ["The snap","Every play starts with the ball passed backwards between the legs to a teammate. At four this can just be you handing the ball over — the ritual matters more than the mechanics."],
   ["Forward pass","The ball may be thrown forward once per play. Catching a moving ball is very hard at this age, so most young play is running only."]],
  words:[["Touchdown","Reaching the end zone with the ball. Six points."],["End zone","The scoring area at each end of the field."],["Down","One attempt to advance the ball."],["Snap","The backwards pass that starts every play."],["Handoff","Giving the ball directly to a teammate."],["Flag pull","Removing a flag from the belt to end the play."],["Offense","The team with the ball."],["Defense","The team trying to stop them."]],
  age4:"Expect the whole group to chase the ball carrier in a pack, flags to fall off on their own constantly, and celebration dances to take longer than the plays. Downs, positions and passing routes are years away. At four the game is: hold the ball, run that way, someone grabs your flag, everyone laughs."},
 zh:{one:"一队持球，想办法把球带到或传到球场另一端；另一队想办法拦住他们。在腰旗橄榄球里 —— 这是四岁孩子唯一该玩的版本 —— 拦人的方式不是擒抱，而是把对方腰带上的布旗抽下来。完全没有身体对抗。",
  labels:{ez:"达阵区",attack:"进攻方往这个方向推进",p1:"传球的人",p2:"持球跑的人",p3:"旗被抽掉＝这一次进攻结束"},
  cap:"这是球场。两端的阴影区就是达阵区。持球的一队要冲到远端那个达阵区；中间那些线只是用来量他们推进了多远。",
  cap2:"一次完整的进攻。球交到持球人手里，持球人朝达阵区跑，防守方一抽掉他腰上的旗，这次进攻立刻结束。",
  game:"一队是进攻方 —— 球在他们手上。比赛是不断停、不断重新开始的：每一次尝试叫做一“档”，进攻方有四档机会把球推进规定的距离。推进成功就再得四档；没成功，球权就交给对方。每次进攻都从把球向后传出开始，到持球人被抽掉旗子或者冲过线为止。",
  score:"达阵得六分 —— 球员带球冲进达阵区，或者在达阵区里接住球。青少年腰旗比赛通常省略之后的加踢，直接数达阵次数。",
  rules:[["抽旗就等于擒抱","每个球员腰上都系一条带两面布旗的腰带。抽掉一面，这次进攻立刻停止。不能抓、不能拉、不能推、不能扑倒。整个青少年版本的比赛都建立在这一条上。"],
   ["完全不许身体接触","不能用手阻挡，不能用肩膀撞持球人，不能扑腿。只要涉及身体相撞，就不属于这个版本的比赛 —— 四岁孩子也不应该穿护具或戴头盔。"],
   ["档数","四次机会把球推进规定距离。这是最让新手家长困惑的一条规则。四岁阶段通常直接不用：每个孩子轮流持球，每次进攻都以达阵收尾。"],
   ["开球（Snap）","每次进攻都从两腿之间把球向后传给队友开始。四岁的时候，这一步可以简化成你直接把球递给他 —— 仪式感比动作规范重要。"],
   ["前传","每次进攻允许向前传球一次。这个年纪接移动中的球非常难，所以小小孩的比赛基本上只跑不传。"]],
  words:[["达阵","带球进入达阵区，得六分。"],["达阵区","球场两端的得分区域。"],["档","一次推进球的尝试机会。"],["开球","每次进攻开始时向后传的那一下。"],["交接球","直接把球递给队友。"],["抽旗","把旗从腰带上抽下来，结束这次进攻。"],["进攻方","持球的一队。"],["防守方","试图拦住他们的一队。"]],
  age4:"你会看到：所有孩子一窝蜂追着持球的人跑、旗子动不动就自己掉下来、庆祝舞跳的时间比进攻本身还长。档数、位置、跑动路线都是好几年以后的事。四岁的比赛就是：抱住球、往那边跑、有人把你的旗抽走、大家一起笑。"},
 es:{one:"Un equipo tiene el balón e intenta llevarlo o lanzarlo hasta el extremo opuesto del campo. El otro intenta detenerlo. En flag football — la única versión que debe jugar un niño de cuatro — detienes a alguien quitándole una tira de tela del cinturón en vez de taclearlo. No hay contacto de ningún tipo.",
  labels:{ez:"ZONA DE ANOTACIÓN",attack:"la ofensiva avanza hacia acá",p1:"pasador",p2:"corredor",p3:"flag quitado = jugada terminada"},
  cap:"El campo. Las franjas sombreadas de cada extremo son las zonas de anotación. El equipo con el balón intenta llegar a la del fondo; las líneas solo miden cuánto han avanzado.",
  cap2:"Una jugada completa. El balón se entrega a un corredor, el corredor va hacia la zona de anotación, y la jugada termina en el momento en que un defensor le quita el flag del cinturón.",
  game:"Un equipo está en ofensiva — tiene el balón. El juego se detiene y reinicia constantemente: cada intento se llama down, y la ofensiva tiene cuatro downs para avanzar cierta distancia. Si lo logra, obtiene cuatro más. Si no, el otro equipo toma el balón. Cada jugada empieza pasando el balón hacia atrás y termina cuando le quitan el flag al portador o cruza la línea.",
  score:"Un touchdown — seis puntos — cuando un jugador lleva el balón a la zona de anotación o lo atrapa ahí. En ligas infantiles se suele omitir la patada extra y solo se cuentan los touchdowns.",
  rules:[["Quitar el flag es taclear","Cada jugador lleva un cinturón con dos flags de tela. Quita uno y la jugada se detiene de inmediato. Nada de agarrar, sujetar, empujar ni taclear. Toda la versión infantil se construye sobre esta regla."],
   ["Cero contacto","Sin bloqueo con las manos, sin hombro contra el corredor, sin lanzarse a las piernas. Si implica cuerpos chocando, no pertenece a esta versión — y ningún niño de cuatro debe usar hombreras ni casco."],
   ["Downs","Cuatro intentos para avanzar cierta distancia. Es la regla que más confunde a los papás nuevos. A los cuatro años normalmente se elimina por completo: cada niño tiene su turno con el balón y cada jugada termina en touchdown."],
   ["El snap","Cada jugada empieza pasando el balón hacia atrás entre las piernas a un compañero. A los cuatro puede ser simplemente que tú le entregues el balón — el ritual importa más que la mecánica."],
   ["Pase hacia adelante","El balón puede lanzarse hacia adelante una vez por jugada. Atrapar un balón en movimiento es dificilísimo a esta edad, así que casi todo el juego infantil es de correr."]],
  words:[["Touchdown","Llegar a la zona de anotación con el balón. Seis puntos."],["Zona de anotación","El área de anotación en cada extremo del campo."],["Down","Un intento de avanzar el balón."],["Snap","El pase hacia atrás que inicia cada jugada."],["Entrega","Dar el balón directamente a un compañero."],["Quitar el flag","Retirar un flag del cinturón para terminar la jugada."],["Ofensiva","El equipo con el balón."],["Defensiva","El equipo que intenta detenerlo."]],
  age4:"Espera que todo el grupo persiga en bola al que lleva el balón, que los flags se caigan solos todo el tiempo, y que los bailes de celebración duren más que las jugadas. Los downs, las posiciones y las rutas de pase están a años de distancia. A los cuatro el juego es: agarra el balón, corre para allá, alguien te quita el flag, todos se ríen."}},
basketball:{
 fig:"bballCourt", fig2:"bballHeight",
 en:{one:"Two teams try to throw a ball through the other team's hoop. You move the ball by bouncing it as you walk or run, or by passing it. The team with more points wins. The whole sport is: get the ball, get near the hoop, put it in.",
  labels:{hoop:"HOOP",key:"the key",arc:"three-point line",half:"halfway line",attack:"your team attacks this way",tall:"10 ft — regulation",low:"4–5 ft — what you want",kid:"4-year-old"},
  cap:"Half a full court. Your driveway version is just the area near one hoop — at this age both teams shoot at the same one, because two hoops is one too many to keep track of.",
  cap2:"The most important picture on this page. A regulation rim is more than three times a four-year-old's height. Set yours to four or five feet, and lower it further if nobody is scoring.",
  game:"One team has the ball and tries to score; the other tries to stop them. If you want to move with the ball you must bounce it — that's dribbling. Stop bouncing and start walking and it's called travelling. When a shot misses, whoever grabs the ball next gets to attack. Play flows almost continuously, with far fewer stoppages than baseball or football.",
  score:"Two points for a basket from close range, three from behind the long arc, one for a free throw after a foul. At age four, count everything as one point — or don't count at all, which is better.",
  rules:[["Bounce it to move","The one rule that defines the sport. Holding the ball and running is travelling. At age four every child will do this constantly and you should completely ignore it — enforcing it stops the game every four seconds and teaches nothing."],
   ["No grabbing or pushing","Contact with an opponent is a foul. At this age it's the only rule worth actually enforcing, and 'hands to yourself' covers it entirely."],
   ["Two hands are fine","Adult basketball is a one-handed shot. Four-year-olds do not have the strength for it, and forcing it early builds a broken motion. Two-handed underhand pushing is correct for now."],
   ["Out of bounds","Ball crosses the outside line, the other team gets it. Worth knowing; not worth calling at this age unless the ball ends up in a neighbour's yard."],
   ["Both teams, same hoop","Not a real rule, but the right one for four-year-olds. Two hoops means half the children run the wrong way. One hoop means everyone always knows where to go."]],
  words:[["Dribble","Bouncing the ball while you move."],["Shot","An attempt to throw the ball through the hoop."],["Rebound","Grabbing the ball after a missed shot."],["Pass","Throwing the ball to a teammate."],["Bounce pass","A pass that bounces once on the way. Much easier to catch."],["Travelling","Moving with the ball without bouncing it."],["Foul","Illegal contact with another player."],["The key","The painted rectangle in front of the hoop."]],
  age4:"Expect two-handed heaves that fall well short, everyone holding the ball and running, and the ball being carried rather than dribbled almost the whole time. The wins here are: bounce it once on purpose, get a shot to touch the rim, and pass to a person rather than into empty space."},
 zh:{one:"两队互相把球投进对方的篮筐。移动时必须一边走或跑一边拍球，或者靠传球把球送出去。得分多的一队赢。整个运动就是：拿到球、靠近篮筐、把球放进去。",
  labels:{hoop:"篮筐",key:"三秒区",arc:"三分线",half:"中线",attack:"你的队往这边进攻",tall:"3.05米 — 标准高度",low:"1.2–1.5米 — 你要的高度",kid:"四岁孩子"},
  cap:"这是半个标准球场。你家车道上的版本就只是靠近一个篮筐的那一小块 —— 这个年纪两队投同一个筐，因为两个筐孩子根本记不过来。",
  cap2:"这一页最重要的一张图。标准篮筐的高度是四岁孩子身高的三倍还多。把你的篮筐调到1.2–1.5米，如果没人能进球就再往下调。",
  game:"一队持球进攻，另一队防守。想带着球移动，就必须拍球 —— 这叫运球。停止拍球又开始走，就叫走步。投篮没进的时候，谁先抢到球谁就转为进攻。比赛几乎是连续的，停顿比棒球和橄榄球少得多。",
  score:"近距离投进得两分，长弧线外投进得三分，犯规后的罚球得一分。四岁阶段，所有球都按一分算 —— 或者干脆不计分，那样更好。",
  rules:[["移动必须拍球","定义这项运动的那一条规则。抱着球跑就是走步。四岁孩子会一直这样，你完全不用管 —— 真去执行的话，比赛每四秒就得停一次，而且什么也教不会。"],
   ["不许拉人推人","和对手发生身体接触就是犯规。这个年纪，这是唯一值得真正执行的规则，一句「手不要碰别人」就够了。"],
   ["用两只手完全可以","成人篮球是单手投篮。四岁孩子没有那个力气，硬要提早练只会练出一个错误动作。现在双手从下往上推才是对的。"],
   ["出界","球越过外侧的线，就归对方。知道就行；这个年纪不用真的判，除非球滚到邻居院子里去了。"],
   ["两队投同一个筐","这不是正式规则，但对四岁孩子来说是对的做法。两个筐意味着一半的孩子会往反方向跑；一个筐意味着所有人永远知道该往哪儿去。"]],
  words:[["运球","一边移动一边拍球。"],["投篮","把球往篮筐里投的尝试。"],["篮板球","投篮没进后抢到的球。"],["传球","把球传给队友。"],["击地传球","中间弹一下地面的传球，好接得多。"],["走步","抱着球移动而不拍球。"],["犯规","和其他球员的违规身体接触。"],["三秒区","篮筐前面那块涂色的长方形区域。"]],
  age4:"你会看到：双手用力一甩但球远远不到、所有人抱着球就跑、几乎全程是抱着球而不是运球。这个年纪的「成功」是：有意识地拍一下球、投出的球能碰到篮筐、把球传给一个人而不是传向空气。"},
 es:{one:"Dos equipos intentan meter el balón en el aro del otro. Para moverte con el balón tienes que botarlo mientras caminas o corres, o pasarlo. Gana el equipo con más puntos. Todo el deporte es: consigue el balón, acércate al aro, mételo.",
  labels:{hoop:"ARO",key:"la zona",arc:"línea de tres",half:"línea de medio campo",attack:"tu equipo ataca hacia acá",tall:"3 m — reglamentario",low:"1.2–1.5 m — lo que necesitas",kid:"niño de 4 años"},
  cap:"Media cancha completa. Tu versión de cochera es solo el área cerca de un aro — a esta edad ambos equipos tiran al mismo, porque dos aros son uno de más para llevar la cuenta.",
  cap2:"La imagen más importante de esta página. Un aro reglamentario mide más de tres veces la altura de un niño de cuatro años. Pon el tuyo a 1.2 o 1.5 metros, y bájalo más si nadie encesta.",
  game:"Un equipo tiene el balón e intenta anotar; el otro intenta detenerlo. Si quieres moverte con el balón tienes que botarlo — eso es driblar. Dejar de botar y caminar se llama pasos. Cuando un tiro falla, quien tome el balón pasa a atacar. El juego fluye casi sin parar, con muchas menos interrupciones que el béisbol o el football.",
  score:"Dos puntos por una canasta de cerca, tres desde detrás del arco largo, uno por un tiro libre tras una falta. A los cuatro años, cuenta todo como un punto — o mejor, no cuentes nada.",
  rules:[["Bota para moverte","La regla que define el deporte. Agarrar el balón y correr son pasos. A los cuatro años todos lo harán constantemente y deberías ignorarlo por completo — aplicarlo detiene el juego cada cuatro segundos y no enseña nada."],
   ["Sin agarrar ni empujar","El contacto con un rival es falta. A esta edad es la única regla que vale la pena aplicar de verdad, y 'manos quietas' la cubre entera."],
   ["Dos manos está bien","El básquet adulto es un tiro con una mano. Los niños de cuatro no tienen esa fuerza, y forzarlo temprano construye un movimiento defectuoso. Empujar con dos manos desde abajo es lo correcto por ahora."],
   ["Fuera de banda","El balón cruza la línea exterior y pasa al otro equipo. Vale saberlo; no vale marcarlo a esta edad salvo que el balón acabe en el patio del vecino."],
   ["Ambos equipos, el mismo aro","No es una regla real, pero es la correcta para niños de cuatro. Dos aros significa que la mitad corre en la dirección equivocada. Un aro significa que todos siempre saben a dónde ir."]],
  words:[["Driblar","Botar el balón mientras te mueves."],["Tiro","Un intento de meter el balón por el aro."],["Rebote","Tomar el balón después de un tiro fallado."],["Pase","Lanzar el balón a un compañero."],["Pase de pique","Un pase que rebota una vez. Mucho más fácil de atrapar."],["Pasos","Moverse con el balón sin botarlo."],["Falta","Contacto ilegal con otro jugador."],["La zona","El rectángulo pintado frente al aro."]],
  age4:"Espera lanzamientos con dos manos que se quedan muy cortos, a todos agarrando el balón y corriendo, y el balón cargado en vez de botado casi todo el tiempo. Los logros aquí son: botar una vez a propósito, lograr que un tiro toque el aro, y pasar a una persona en vez de al espacio vacío."}}

};
