<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Backyard Coach — 12-week soccer, t-ball and flag football practice plans, gear lists and drill timers for parents coaching 3–5 year olds. English, 中文, Español.">
<meta name="theme-color" content="#EEF1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Backyard Coach">
<meta property="og:title" content="Backyard Coach">
<meta property="og:description" content="12-week practice plans, gear lists and drill timers for parents coaching 3–5 year olds.">
<meta property="og:type" content="website">
<title>Backyard Coach · 后院教练 · Entrenador de Patio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101E1A; --ink-2:#41544E; --ink-3:#7B8B85;
  --paper:#EEF1EE; --card:#FFFFFF; --line:#D3DAD6;
  --cone:#FF6A13; --accent:#1E9E52; --accent-soft:#E4F3EA;
  --shadow:0 1px 0 rgba(16,30,26,.06), 0 6px 18px -8px rgba(16,30,26,.28);
  --r:14px; --disp:'Barlow Condensed',Impact,sans-serif;
}
body[data-sport="soccer"]{--accent:#1E9E52;--accent-soft:#E4F3EA;}
body[data-sport="baseball"]{--accent:#C0492B;--accent-soft:#F8E9E5;}
body[data-sport="football"]{--accent:#A85C22;--accent-soft:#F6EDE3;}
body[data-sport="basketball"]{--accent:#5B4B9E;--accent-soft:#ECEAF6;}
body[data-lang="zh"]{--disp:'Noto Sans SC',sans-serif;}
body[data-lang="zh"] h1,body[data-lang="zh"] h2,body[data-lang="zh"] h3,body[data-lang="zh"] h4{letter-spacing:0}
body[data-lang="zh"]{font-family:'Noto Sans SC','Barlow',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-x:hidden}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:.01em;line-height:1.05}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--cone);outline-offset:2px;border-radius:6px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brandrow{display:flex;align-items:center;gap:9px;padding:11px 0 9px}
.brand{font-family:var(--disp);font-weight:800;font-size:24px;text-transform:uppercase;flex:1;min-width:0}
body[data-lang="zh"] .brand{text-transform:none;font-size:22px}
.brand em{font-style:normal;color:var(--accent)}
.langsw{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);flex:0 0 auto}
.langsw button{padding:5px 9px;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--ink-3);letter-spacing:.04em}
body[data-lang="zh"] .langsw button{font-family:'Noto Sans SC',sans-serif}
.langsw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sportsw{display:flex;gap:7px;padding-bottom:11px}
.sportsw button{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 4px 8px;
  font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.14s}
body[data-lang="zh"] .sportsw button{text-transform:none;letter-spacing:0}
.sportsw button .ico{font-size:18px;line-height:1}
.sportsw button .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sportsw button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(16,30,26,.16)}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--ink-3);display:flex;align-items:center;gap:9px;margin:26px 0 11px}
body[data-lang="zh"] .eyebrow{text-transform:none;letter-spacing:.04em;font-size:14px}
.eyebrow::after{content:"";flex:1;height:1.5px;background:var(--line)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink-2);font-size:15.5px}
.planhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px}
.planhead h2{font-size:30px;text-transform:uppercase;margin:0}
body[data-lang="zh"] .planhead h2{text-transform:none;font-size:26px}
.planmeta{font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);white-space:nowrap;padding-bottom:3px}
body[data-lang="zh"] .planmeta{text-transform:none;letter-spacing:0}
.startbtn{width:100%;margin-top:14px;background:var(--cone);color:#fff;border-radius:12px;padding:16px;
  font-family:var(--disp);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.05em;
  box-shadow:0 4px 0 #C24E08;transition:.1s}
body[data-lang="zh"] .startbtn{text-transform:none;letter-spacing:.02em}
.startbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #C24E08}
.ghostbtn{width:100%;margin-top:9px;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:11px;
  font-family:var(--disp);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
body[data-lang="zh"] .ghostbtn{text-transform:none;letter-spacing:0}
.abrow{display:flex;gap:7px;margin:14px 0 10px}
.abrow button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px;
  font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
body[data-lang="zh"] .abrow button{text-transform:none;letter-spacing:0}
.abrow button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.kitrow{display:flex;align-items:center;gap:11px;padding:11px 13px;margin-bottom:12px}
.kitrow .kt{flex:1;min-width:0}
.kitrow .kt b{font-family:var(--disp);font-weight:700;font-size:16px;display:block}
.kitrow .kt span{font-size:13.5px;color:var(--ink-2)}
.tog{flex:0 0 50px;height:29px;border-radius:99px;background:var(--line);position:relative;transition:.16s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:99px;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.kitrow[aria-pressed="true"] .tog{background:var(--accent)}
.kitrow[aria-pressed="true"] .tog::after{transform:translateX(21px)}
.drill{display:flex;margin-bottom:9px;overflow:hidden;width:100%;text-align:left;align-items:stretch}
.drill .num{flex:0 0 54px;background:var(--accent-soft);border-right:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.drill .num b{font-family:var(--disp);font-size:26px;font-weight:800;color:var(--accent);line-height:1}
.drill .num span{font-family:var(--disp);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
body[data-lang="zh"] .drill .num span{letter-spacing:0;font-size:11.5px}
.drill .body{padding:11px 13px;flex:1;min-width:0}
.drill .body h3{font-size:19.5px;margin:0 0 2px;text-transform:uppercase}
body[data-lang="zh"] .drill .body h3{text-transform:none;font-size:18px}
.drill .body p{margin:0;font-size:14.5px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.09em;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin:0 3px 4px 0}
body[data-lang="zh"] .tag{text-transform:none;letter-spacing:0;font-size:12px}
.tag.new{background:var(--cone);color:#fff}
.tag.kit{background:var(--ink);color:#fff}
.phase{margin-top:22px}
.phasehead{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.phasehead h3{font-size:20px;text-transform:uppercase;margin:0}
body[data-lang="zh"] .phasehead h3{text-transform:none}
.phasehead span{font-family:var(--disp);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
body[data-lang="zh"] .phasehead span{text-transform:none;letter-spacing:0}
.wk{display:flex;align-items:stretch;width:100%;text-align:left;margin-bottom:8px;overflow:hidden;transition:.14s}
.wk .wn{flex:0 0 50px;background:var(--accent-soft);border-right:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.wk .wn b{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--accent);line-height:1}
.wk .wn span{font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
body[data-lang="zh"] .wk .wn span{letter-spacing:0;font-size:11px}
.wk .wb{padding:10px 12px;flex:1;min-width:0}
.wk .wb h4{margin:0 0 2px;font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase}
body[data-lang="zh"] .wk .wb h4{text-transform:none;font-size:17px}
.wk .wb p{margin:0;font-size:14px;color:var(--ink-2)}
.wk .wr{display:flex;align-items:center;padding-right:12px;gap:5px}
.sdot{width:15px;height:15px;border-radius:5px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.sdot.on{background:var(--accent);border-color:var(--accent)}
.wk[data-cur="1"]{border-color:var(--cone);box-shadow:0 0 0 2.5px rgba(255,106,19,.22),var(--shadow)}
.wk[data-cur="1"] .wn{background:var(--cone)}
.wk[data-cur="1"] .wn b,.wk[data-cur="1"] .wn span{color:#fff}
.mile{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--cone);border-radius:0 12px 12px 0;padding:13px 15px;margin-top:12px}
.mile h4{margin:0 0 4px;font-family:var(--disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3)}
body[data-lang="zh"] .mile h4{text-transform:none;letter-spacing:.03em;font-size:14px}
.mile p{margin:0;font-size:16px}
.tierhead{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 8px}
.tierhead h3{font-size:21px;text-transform:uppercase;margin:0}
body[data-lang="zh"] .tierhead h3{text-transform:none}
.tierhead span{font-family:var(--disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
body[data-lang="zh"] .tierhead span{text-transform:none;letter-spacing:0}
.gear{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-bottom:1.5px solid var(--line);width:100%;text-align:left}
.gear:last-child{border-bottom:0}
.gimg{flex:0 0 54px;height:54px;background:var(--accent-soft);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.gimg svg{width:38px;height:38px}
.box{flex:0 0 24px;height:24px;border:2.5px solid var(--line);border-radius:7px;margin-top:15px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.12s}
.gear[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.gear[aria-pressed="true"] .gname{text-decoration:line-through;color:var(--ink-3)}
.gear[aria-pressed="true"] .gimg{opacity:.45}
.gtxt{flex:1;min-width:0;padding-top:2px}
.gname{font-family:var(--disp);font-weight:700;font-size:17.5px;line-height:1.2;display:block}
.gwhy{font-size:13.5px;color:var(--ink-2);display:block;margin-top:2px}
.gprice{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink-3);display:block;margin-top:3px}
.budget{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;margin-top:14px;background:var(--ink);color:#fff;border-radius:12px}
.budget b{font-family:var(--disp);font-size:25px;font-weight:800}
.budget span{font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#A9BAB4}
body[data-lang="zh"] .budget span{text-transform:none;letter-spacing:0}
.skip{padding:13px 15px}
.skip li{margin-bottom:6px;font-size:15px;color:var(--ink-2)}
.skip li b{color:var(--ink)}
.rule{display:flex;gap:12px;padding:13px 14px;border-bottom:1.5px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .k{flex:0 0 30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;font-family:var(--disp);
  font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.rule h4{margin:0 0 2px;font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase}
body[data-lang="zh"] .rule h4{text-transform:none;font-size:17px}
.rule p{margin:0;font-size:15px;color:var(--ink-2)}
details.fix{border-bottom:1.5px solid var(--line)}
details.fix:last-child{border-bottom:0}
details.fix summary{padding:13px 14px;font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;
  list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
body[data-lang="zh"] details.fix summary{text-transform:none;font-size:17px}
details.fix summary::-webkit-details-marker{display:none}
details.fix summary::after{content:"+";color:var(--accent);font-size:24px}
details.fix[open] summary::after{content:"–"}
details.fix .ans{padding:0 14px 14px;font-size:15.5px;color:var(--ink-2)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1.5px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--disp);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
body[data-lang="zh"] nav button{text-transform:none;letter-spacing:0;font-size:13px}
nav button .ico{font-size:20px;line-height:1}
nav button[aria-pressed="true"]{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top);display:none}
.sheet.on{display:block;animation:up .22s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.sheettop{position:sticky;top:0;background:var(--paper);border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 16px;z-index:2}
.sheettop .x{font-size:26px;line-height:1;color:var(--ink-2);padding:0 4px}
.sheettop h2{font-size:21px;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body[data-lang="zh"] .sheettop h2{text-transform:none}
.dsec{margin:20px 0}
.dsec h4{font-family:var(--disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);margin:0 0 6px}
body[data-lang="zh"] .dsec h4{text-transform:none;letter-spacing:.03em;font-size:14px}
.dsec p{margin:0;font-size:16.5px}
.cue{background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 15px}
.cue p{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.25;color:var(--accent)}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.adj div{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px}
.adj h5{margin:0 0 3px;font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
body[data-lang="zh"] .adj h5{text-transform:none;letter-spacing:0;font-size:15px}
.adj p{font-size:14.5px;color:var(--ink-2)}
#run{background:var(--accent);color:#fff}
#run .runtop{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top))}
#run .runtop button{color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.07em;opacity:.85}
body[data-lang="zh"] #run .runtop button{text-transform:none;letter-spacing:0}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.runbody{padding:0 22px 30px;text-align:center}
.runtag{font-family:var(--disp);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.14em;opacity:.85}
body[data-lang="zh"] .runtag{text-transform:none;letter-spacing:.03em}
.runbody h2{font-size:clamp(32px,9.5vw,50px);text-transform:uppercase;margin:6px 0 4px;line-height:1}
body[data-lang="zh"] .runbody h2{text-transform:none}
.clock{font-family:var(--disp);font-weight:800;font-size:clamp(76px,25vw,120px);line-height:.9;letter-spacing:-.02em;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.clock.done{animation:flash 1s steps(1) infinite}
@keyframes flash{50%{opacity:.35}}
.runhow{background:rgba(255,255,255,.14);border-radius:14px;padding:15px 17px;text-align:left;font-size:16px;margin:16px 0}
.runcue{font-family:var(--disp);font-weight:800;font-size:23px;text-transform:uppercase;line-height:1.2;margin:6px 0 18px}
body[data-lang="zh"] .runcue{text-transform:none}
.runctl{display:flex;gap:9px}
.runctl button{flex:1;background:#fff;color:var(--accent);border-radius:12px;padding:15px;font-family:var(--disp);
  font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.05em}
body[data-lang="zh"] .runctl button{text-transform:none;letter-spacing:0}
.runctl button.ghost{background:rgba(255,255,255,.16);color:#fff}
.finish{text-align:center;padding:50px 24px}
.finish .big{font-size:62px}
.finish h2{font-size:36px;text-transform:uppercase;margin:14px 0 8px}
body[data-lang="zh"] .finish h2{text-transform:none}
.fig{padding:14px 13px 11px;overflow:hidden}
.fig svg{width:100%;height:auto;display:block}
.figcap{font-size:13.5px;color:var(--ink-3);margin:9px 2px 0;line-height:1.5}
.ruleB{display:flex;gap:11px;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.ruleB:last-child{border-bottom:0}
.ruleB .n{flex:0 0 25px;height:25px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  font-family:var(--disp);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ruleB h4{margin:0 0 2px;font-family:var(--disp);font-weight:700;font-size:17.5px;text-transform:uppercase}
body[data-lang="zh"] .ruleB h4{text-transform:none;font-size:17px}
.ruleB p{margin:0;font-size:14.5px;color:var(--ink-2)}
.word{display:flex;gap:11px;padding:10px 14px;border-bottom:1.5px solid var(--line);align-items:baseline}
.word:last-child{border-bottom:0}
.word b{flex:0 0 34%;font-family:var(--disp);font-weight:700;font-size:16.5px;line-height:1.25}
.word span{flex:1;font-size:14.5px;color:var(--ink-2)}
svg .fld{fill:var(--accent-soft)}
svg .ln{stroke:var(--accent);stroke-width:2;fill:none}
svg .ln2{stroke:var(--line);stroke-width:2;fill:none}
svg .sld{fill:var(--accent)}
svg .dk{fill:var(--ink)}
svg .tx{font-family:var(--disp);font-weight:700;font-size:13px;fill:var(--ink-2)}
body[data-lang="zh"] svg .tx{font-family:'Noto Sans SC',sans-serif;font-size:12.5px}
svg .txs{font-family:var(--disp);font-weight:700;font-size:11.5px;fill:var(--ink-3)}
body[data-lang="zh"] svg .txs{font-family:'Noto Sans SC',sans-serif;font-size:11px}
.note{font-size:13.5px;color:var(--ink-3);line-height:1.55;margin:16px 0 8px}
#foot{margin:34px 0 8px;padding:18px 2px 4px;border-top:1.5px solid var(--line);text-align:center}
#foot p{margin:0 0 7px;font-size:13px;line-height:1.55;color:var(--ink-3)}
#foot p:last-child{margin-bottom:0}

 en:{n:"Ladder hop",setup:"Agility ladder flat on the grass. Everyone lines up at one end — but keep the line to two or three kids so nobody waits.",how:"Two feet in every square, walking at first. Then one foot per square. Then side-steps facing sideways. Then bunny hops with both feet together. Change the pattern every 30 seconds and let a child invent one.",cue:"Two feet in every box!",e:"Walk it slowly holding your hand. Stepping on the rungs is completely fine at this age.",h:"Hop on one foot, or go backwards."},
 zh:{n:"敏捷梯跳格",setup:"敏捷梯平铺在草地上。大家在一端排队 —— 但每队只留两三个孩子，别让人干等。",how:"先走：每一格踩两只脚。然后每格一只脚。然后侧着身子横向移动。然后双脚并拢像小兔子一样跳。每30秒换一种玩法，也让孩子自己发明一种。",cue:"每一格都要踩两只脚！",e:"牵着手慢慢走。这个年纪踩到横杆上完全没关系。",h:"改成单脚跳，或者倒着走。"},
 es:{n:"Saltos en la escalera",setup:"Escalera de agilidad plana sobre el césped. Todos en fila en un extremo — máximo dos o tres niños por fila para que nadie espere.",how:"Los dos pies en cada cuadro, caminando al principio. Luego un pie por cuadro. Luego pasos laterales de costado. Luego saltos de conejo con los pies juntos. Cambia el patrón cada 30 segundos y deja que un niño invente uno.",cue:"¡Los dos pies en cada cuadro!",e:"Camínala despacio de tu mano. Pisar los travesaños está perfectamente bien a esta edad.",h:"Salta en un pie, o hazla hacia atrás."}},
m2:{tag:"move",min:3,kit:1,
 en:{n:"Jungle jumps",setup:"Six mini hurdles in a line, about two steps apart. Set them at the lowest height.",how:"Jump over each hurdle with two feet together, landing softly with bent knees. Give each hurdle an animal name — the crocodile, the snake — and let them shout it as they jump. Go through three or four times.",cue:"Two feet — land soft like a bunny!",e:"Step over instead of jumping, or lay the hurdles flat as lines to step over.",h:"Jump sideways over them, or add a fourth and fifth hurdle."},
 zh:{n:"跳过小丛林",setup:"六个迷你跨栏排成一列，间隔约两步。调到最低高度。",how:"双脚并拢跳过每个栏，落地时屈膝、轻轻落。给每个栏起个动物名字 —— 鳄鱼、蛇 —— 跳过去的时候让他们喊出来。来回三到四趟。",cue:"双脚一起 —— 像小兔子一样轻轻落地！",e:"改成跨过去而不是跳过去，或者把栏放平当成线来跨。",h:"改成侧向跳，或者再加两个栏。"},
 es:{n:"Saltos de la selva",setup:"Seis mini vallas en fila, a unos dos pasos de distancia. Ponlas en la altura más baja.",how:"Salta cada valla con los dos pies juntos, cayendo suave con las rodillas flexionadas. Ponle un nombre de animal a cada valla — el cocodrilo, la serpiente — y que lo griten al saltar. Tres o cuatro pasadas.",cue:"¡Los dos pies — cae suave como un conejo!",e:"Que pasen por encima caminando, o acuesta las vallas como líneas para cruzar.",h:"Que salten de lado, o agrega una cuarta y quinta valla."}},
m3:{tag:"move",min:3,kit:1,
 en:{n:"Zoo walk",setup:"Agility ladder on the grass, or two chalk lines if you don't have one.",how:"Travel down the ladder as an animal you call out: bear (hands and feet), crab (belly up), bunny (two-foot hops), flamingo (one foot per square). Kids pick the next animal. This builds more real coordination than any drill with a ball in it.",cue:"Now you're a bear — hands and feet!",e:"Stay with bear and bunny only; skip crab, which is genuinely hard at four.",h:"Go backwards, or do two animals in one trip."},
 zh:{n:"动物园走路",setup:"敏捷梯放在草地上；没有的话用粉笔画两条线也行。",how:"按你喊的动物方式沿着梯子走：狗熊（手脚着地）、螃蟹（肚子朝上）、兔子（双脚跳）、火烈鸟（每格一只脚）。让孩子选下一个动物。这个比任何带球的练习都更能练协调性。",cue:"现在你是一只熊 —— 手脚一起走！",e:"只玩狗熊和兔子；螃蟹对四岁孩子来说确实很难，可以跳过。",h:"倒着走，或者一趟里换两种动物。"},
 es:{n:"Caminata del zoológico",setup:"Escalera de agilidad en el césped, o dos líneas de gis si no tienes una.",how:"Recorre la escalera como el animal que grites: oso (manos y pies), cangrejo (panza arriba), conejo (saltos con dos pies), flamenco (un pie por cuadro). Los niños eligen el siguiente animal. Esto desarrolla más coordinación real que cualquier ejercicio con balón.",cue:"¡Ahora eres un oso — manos y pies!",e:"Quédate solo con oso y conejo; el cangrejo es genuinamente difícil a los cuatro.",h:"Hazlo hacia atrás, o dos animales en un mismo recorrido."}},
m4:{tag:"move",min:3,kit:1,
 en:{n:"Weave the towers",setup:"Six tall cones in a line, three steps apart.",how:"Run a zigzag through the towers, then walk back. Once they've got it, add the ball — dribble through in soccer, carry the ball in football, or run it while holding a glove in t-ball. Tall cones matter here: a four-year-old can see them from the side, and flat discs disappear.",cue:"Zigzag — don't knock the tower over!",e:"Space the cones further apart and walk it.",h:"Move the cones closer, or add the ball."},
 zh:{n:"绕桶穿行",setup:"六个高标志桶排成一列，间隔三步。",how:"以之字形跑着穿过标志桶，然后走回来。熟练之后加上球 —— 足球就带球绕，橄榄球就抱着球跑，棒球就戴着手套跑。这里一定要用高桶：四岁孩子从侧面能看见高桶，扁平的标志盘他们看不到。",cue:"之字形 —— 别把桶碰倒了！",e:"把桶的间距拉大，改成走。",h:"把桶靠近一些，或者加上球。"},
 es:{n:"Zigzag entre torres",setup:"Seis conos altos en fila, a tres pasos de distancia.",how:"Corre en zigzag entre los conos y regresa caminando. Cuando lo dominen, agrega el balón — driblando en fútbol, cargando el balón en flag, o corriendo con el guante puesto en t-ball. Los conos altos importan: un niño de cuatro los ve de lado, y los discos planos desaparecen.",cue:"¡Zigzag — no tumbes la torre!",e:"Separa más los conos y háganlo caminando.",h:"Acerca los conos, o agrega el balón."}},
m5:{tag:"move",min:5,kit:1,
 en:{n:"Obstacle course",setup:"Ladder, then three hurdles, then four tall cones to weave, then a finish line. Build it together with the kids — the building is half the fun.",how:"One at a time through the whole course, everyone else cheering. Then go again and try to beat the last run. Nobody is timed against anyone else. Let them redesign it halfway through; it will get better and sillier.",cue:"Ladder, jump, zigzag, GO!",e:"Cut it to two obstacles. Run it beside them the first time.",h:"Add the ball through the whole course, or run it backwards."},
 zh:{n:"障碍闯关",setup:"先敏捷梯，再三个跨栏，再四个高标志桶绕行，最后一条终点线。和孩子一起摆 —— 摆场地本身就是一半的乐趣。",how:"一次一个人跑完全程，其他人在旁边加油。然后再来一次，看能不能比上一次更好。不和别人比时间。中途让他们自己改路线，只会越改越有意思。",cue:"爬梯、跳栏、绕桶，冲！",e:"减到两个障碍。第一次陪着孩子一起跑。",h:"全程带球，或者倒着跑一遍。"},
 es:{n:"Circuito de obstáculos",setup:"Escalera, luego tres vallas, luego cuatro conos altos en zigzag, y una línea de meta. Ármalo junto con los niños — armarlo es la mitad de la diversión.",how:"Uno a la vez por todo el circuito, los demás echando porras. Después otra vuelta para mejorar la anterior. Nadie compite contra nadie. Déjalos rediseñarlo a media práctica; quedará mejor y más divertido.",cue:"¡Escalera, salto, zigzag, YA!",e:"Redúcelo a dos obstáculos. Corre a su lado la primera vez.",h:"Agrega el balón en todo el circuito, o córrelo al revés."}}
};

/* ============ SPORT DRILLS ============ */
const D={
/* ---- SOCCER ---- */
s1:{tag:"warm",min:3,
 en:{n:"Wake-up toes",setup:"Everyone stands on their own ball in a loose circle around you.",how:"Tap the top of the ball with the bottom of one foot, then the other. Then roll it side to side. Then jump over it and back. Change every 20 seconds so nobody stalls.",cue:"Light taps — like popcorn!",e:"Just tap one foot, or touch the ball with hands first.",h:"Speed rounds: 'ten fast taps, go!'"},
 zh:{n:"叫醒小脚",setup:"每人一个球，踩在自己球上，围成一个松散的圈站在你周围。",how:"用一只脚的脚底轻点球顶，再换另一只脚。然后把球左右来回拨。然后跳过球再跳回来。每20秒换一个动作，别让人愣着。",cue:"轻轻点 —— 像爆米花一样！",e:"只用一只脚点，或者先允许用手摸球。",h:"来个速度赛：“快点十下，开始！”"},
 es:{n:"Despertar los pies",setup:"Cada uno de pie sobre su propio balón, en un círculo suelto alrededor de ti.",how:"Toca la parte de arriba del balón con la planta de un pie, luego con el otro. Después rueda el balón de lado a lado. Después salta por encima y regresa. Cambia cada 20 segundos para que nadie se estanque.",cue:"¡Toques suaves — como palomitas!",e:"Solo con un pie, o deja que toquen el balón con las manos primero.",h:"Ronda de velocidad: '¡diez toques rápidos, ya!'"}},
s10:{tag:"warm",min:3,
 en:{n:"Follow the leader",setup:"Everyone with a ball, you at the front.",how:"You dribble slowly around the yard and everyone follows in a wobbly line, copying what you do — big steps, tiny steps, stop, turn, wiggle. Then let a child lead.",cue:"Do what I do — stay close!",e:"Walk instead of jog.",h:"Add sudden stops and turns."},
 zh:{n:"跟着领队走",setup:"每人一个球，你在最前面。",how:"你慢慢带球在院子里绕，大家排成歪歪扭扭的一队跟在后面模仿你 —— 大步、小碎步、急停、转身、扭一扭。然后换一个孩子当领队。",cue:"我怎么做你就怎么做 —— 跟紧点！",e:"改成走，不要小跑。",h:"加入突然的急停和转身。"},
 es:{n:"Sigue al líder",setup:"Cada uno con su balón, tú al frente.",how:"Driblas despacio por el patio y todos te siguen en una fila chueca, copiando lo que haces — pasos grandes, pasitos, alto, giro, meneo. Después deja que un niño sea el líder.",cue:"¡Haz lo que yo hago — no te quedes atrás!",e:"Caminen en vez de trotar.",h:"Agrega frenadas y giros repentinos."}},
s2:{tag:"control",min:4,
 en:{n:"Red light, green light",setup:"Everyone with a ball on one line, you about 15 steps away.",how:"Green light means dribble toward you. Red light means stop the ball with the bottom of your foot and freeze. Nobody goes back for moving — just call it out and giggle. High five at the end, then run back and go again.",cue:"Foot on top — freeze like a statue!",e:"Call 'red light' loudly and count to three before checking.",h:"Add yellow light for slow motion."},
 zh:{n:"红灯绿灯",setup:"每人一个球站在一条线上，你站在约15步开外。",how:"绿灯就带球朝你走，红灯就用脚底把球停住、原地不动。动了也不用退回去 —— 指出来一起笑一笑就行。到了终点击掌，然后跑回去再来一轮。",cue:"脚踩住球 —— 像雕像一样别动！",e:"“红灯”喊得响一点，数到三再检查。",h:"加一个黄灯，表示慢动作。"},
 es:{n:"Luz roja, luz verde",setup:"Todos con balón en una línea, tú a unos 15 pasos.",how:"Luz verde: driblan hacia ti. Luz roja: paran el balón con la planta y se congelan. Nadie regresa por moverse — solo señálalo y ríanse. Choca los cinco al final, corran de regreso y otra vez.",cue:"¡Pie encima — congélate como estatua!",e:"Grita 'luz roja' fuerte y cuenta hasta tres antes de revisar.",h:"Agrega luz amarilla para cámara lenta."}},
s3:{tag:"control",min:3,
 en:{n:"Body part freeze",setup:"Open area, everyone dribbling their own ball.",how:"Kids dribble anywhere. You shout a body part — knee, elbow, belly, nose — and they stop the ball and touch it with that part. Then go again. Fast and silly.",cue:"Dribble, dribble… ELBOW!",e:"Use only foot and hand.",h:"Call two parts at once."},
 zh:{n:"身体部位定格",setup:"一片开阔地，每人带着自己的球。",how:"孩子随便带球跑。你喊一个身体部位 —— 膝盖、胳膊肘、肚子、鼻子 —— 他们就停球并用那个部位碰一下球，然后继续跑。要快，要好笑。",cue:"带球、带球…… 胳膊肘！",e:"只喊脚和手。",h:"一次喊两个部位。"},
 es:{n:"Congelado por partes",setup:"Área abierta, cada uno driblando su balón.",how:"Los niños driblan por donde sea. Gritas una parte del cuerpo — rodilla, codo, panza, nariz — y paran el balón y lo tocan con esa parte. Luego siguen. Rápido y chistoso.",cue:"Dribla, dribla… ¡CODO!",e:"Usa solo pie y mano.",h:"Grita dos partes a la vez."}},
s9:{tag:"control",min:4,
 en:{n:"Cone gates",setup:"Scatter eight pairs of cones as little gates, two steps wide, all over the yard.",how:"Dribble through as many gates as you can before you say stop. Count them out loud together. Reset and beat the score. Gates teach steering without a single instruction.",cue:"Find another gate — go!",e:"Wider gates, fewer of them.",h:"Narrow the gates, or say each gate counts only once."},
 zh:{n:"穿过小门",setup:"用标志桶两两一组摆成八个“小门”，每个门宽两步，散布在整个院子里。",how:"在你喊停之前，尽量多地带球穿过小门。一起大声数数。然后重来一轮，看能不能超过上次。小门能让孩子自然学会控制方向，一句指令都不用讲。",cue:"再找一个门 —— 冲！",e:"门开宽一点，数量少一点。",h:"门收窄，或者规定每个门只能算一次。"},
 es:{n:"Puertas de conos",setup:"Reparte ocho pares de conos como puertitas de dos pasos de ancho por todo el patio.",how:"Driblen por tantas puertas como puedan antes de que digas alto. Cuéntenlas en voz alta juntos. Reinicien e intenten superar el número. Las puertas enseñan a dirigir el balón sin una sola instrucción.",cue:"¡Busca otra puerta — corre!",e:"Puertas más anchas y menos cantidad.",h:"Puertas más angostas, o cada puerta cuenta solo una vez."}},
s11:{tag:"control",min:3,
 en:{n:"Turn and go",setup:"One cone per child, spread out.",how:"Dribble to your cone, stop the ball with your foot, turn around, dribble back. Make it a story — the cone is a monster, don't let it get your ball.",cue:"Stop it, turn, go!",e:"Let them pick the ball up to turn.",h:"Two cones — turn at each one."},
 zh:{n:"转身回来",setup:"每个孩子一个标志桶，分散摆开。",how:"带球到自己的桶前，用脚把球停住，转身，再带回来。编个故事 —— 桶是个小怪兽，别让它抢走你的球。",cue:"停住、转身、走！",e:"允许他们用手把球抱起来转身。",h:"摆两个桶，每个桶都要转一次。"},
 es:{n:"Frena y regresa",setup:"Un cono por niño, bien separados.",how:"Dribla hasta tu cono, para el balón con el pie, date la vuelta y regresa driblando. Cuéntalo como historia — el cono es un monstruo, no dejes que te quite el balón.",cue:"¡Párala, gira, vamos!",e:"Déjalos levantar el balón con las manos para girar.",h:"Dos conos — giro en cada uno."}},
s12:{tag:"pass",min:3,
 en:{n:"Roll it to me",setup:"Face your child, four steps apart. One ball.",how:"Push the ball to each other with the inside of the foot — not a kick, a push. Count passes out loud. The first idea of passing is simply that the ball goes to a person on purpose.",cue:"Side of the foot — push it to me!",e:"Roll it with hands first, then feet.",h:"Step back one pace. Add a second ball going the other way."},
 zh:{n:"推给我",setup:"和孩子面对面站，相距四步。一个球。",how:"用脚内侧把球推给对方 —— 是推，不是踢。大声数传了多少次。传球最初的概念，只是“球是有意送到某个人那里的”。",cue:"用脚内侧 —— 推给我！",e:"先用手滚，再改用脚。",h:"往后退一步。再加一个球从反方向传。"},
 es:{n:"Ruédamela",setup:"Frente a tu hijo, a cuatro pasos. Un balón.",how:"Empújense el balón con el interior del pie — no es un patadón, es un empujón. Cuenten los pases en voz alta. La primera idea del pase es simplemente que el balón va hacia una persona a propósito.",cue:"¡Con el lado del pie — empújala hacia mí!",e:"Ruédenla con las manos primero, luego con los pies.",h:"Retrocede un paso. Agrega un segundo balón en sentido contrario."}},
s4:{tag:"game",min:4,
 en:{n:"Sharks and minnows",setup:"Two lines about 15 steps apart. Kids on one line with a ball each. You in the middle.",how:"Kids dribble across while you try to kick their ball out. Nobody is ever out — if your ball goes out, chase it, bring it back, jump in again. Be a comically slow shark.",cue:"Keep it close! Little touches!",e:"Wider area, move slower.",h:"Narrow the area, or add a second shark."},
 zh:{n:"鲨鱼抓小鱼",setup:"两条线相距约15步。孩子站在一条线上，每人一个球。你站中间。",how:"孩子带球穿过去，你想办法把他们的球踢出场。永远没有人“出局” —— 球被踢出去了就去追回来，回到起点再来一次。你要当一条慢得很搞笑的鲨鱼。",cue:"把球带近点！小步碰球！",e:"场地拉宽，你动作慢一点。",h:"场地收窄，或者再加一条鲨鱼。"},
 es:{n:"Tiburones y sardinas",setup:"Dos líneas a unos 15 pasos. Los niños en una línea, cada uno con balón. Tú en medio.",how:"Los niños cruzan driblando mientras intentas sacarles el balón. Nadie queda eliminado nunca — si te sacan el balón, ve por él, regresa y vuelve a entrar. Sé un tiburón cómicamente lento.",cue:"¡Cerquita! ¡Toques pequeños!",e:"Área más ancha, muévete más lento.",h:"Área más angosta, o agrega un segundo tiburón."}},
s5:{tag:"shoot",min:4,
 en:{n:"Knock down the towers",setup:"Stack cones into six little towers about six steps from a shooting line.",how:"Everyone shoots at the towers, chases their own ball, comes back, shoots again. Reset constantly. No turns, no lines — endless shooting.",cue:"Laces down, kick the middle!",e:"Move the line closer, use bigger targets.",h:"Move back, or roll the ball so they strike it moving."},
 zh:{n:"打倒小塔",setup:"把标志桶叠成六座小塔，摆在离射门线约六步的地方。",how:"所有人一起射门打塔，自己去追球，跑回来再射。不停地把塔扶起来。不排队、不轮流 —— 一直射。",cue:"脚背压下去，踢中间！",e:"射门线往前挪，用更大的目标。",h:"往后退几步，或者你把球滚过去让他踢动着的球。"},
 es:{n:"Derriba las torres",setup:"Apila conos en seis torrecitas a unos seis pasos de una línea de tiro.",how:"Todos disparan a las torres, van por su propio balón, regresan y disparan otra vez. Reacomoda las torres constantemente. Sin turnos, sin filas — disparos sin parar.",cue:"¡Empeine abajo, pégale al centro!",e:"Acerca la línea, usa blancos más grandes.",h:"Aléjate, o ruédale el balón para que le pegue en movimiento."}},
s13:{tag:"combine",min:4,
 en:{n:"Dribble then shoot",setup:"Two cone gates leading to a goal, about eight steps of runway.",how:"Dribble through the gates, then shoot at the goal. Two things in a row is genuinely hard at four — expect a lot of forgetting the second part, and cheer anyway.",cue:"Through the gates… now SHOOT!",e:"Drop the gates, just dribble and shoot.",h:"Add a third gate or a defender who walks."},
 zh:{n:"带球再射门",setup:"两个标志桶小门通向球门，助跑距离约八步。",how:"先带球穿过小门，然后射门。四岁孩子要连着做两件事是真的很难 —— 他们经常会忘掉第二步，忘了也照样鼓掌。",cue:"穿过小门…… 射门！",e:"把小门去掉，只做带球加射门。",h:"再加第三个小门，或者加一个走着防守的人。"},
 es:{n:"Dribla y dispara",setup:"Dos puertas de conos que llevan a una portería, unos ocho pasos de recorrido.",how:"Dribla por las puertas y luego dispara a la portería. Dos cosas seguidas es genuinamente difícil a los cuatro — espera que olviden la segunda parte muchas veces, y aplaude igual.",cue:"Por las puertas… ¡ahora DISPARA!",e:"Quita las puertas, solo driblar y disparar.",h:"Agrega una tercera puerta o un defensor que camine."}},
s7:{tag:"game",min:4,
 en:{n:"Clean your room",setup:"Split the yard in half with cones. Every ball you own on the ground, half each side.",how:"Two teams. On 'go', kick balls out of your half into the other. Nobody wins. Play 90 seconds, rest, repeat. More kicks per minute than any drill.",cue:"Clean your room! Kick them out!",e:"Fewer balls, smaller area.",h:"They must dribble it over the line, not kick it."},
 zh:{n:"打扫房间",setup:"用标志桶把院子分成两半。把家里所有的球都放地上，两边各一半。",how:"分成两队。喊“开始”后，把自己这半边的球全都踢到对面去。没有输赢。踢90秒，休息，再来一轮。这个游戏每分钟的触球次数比任何练习都多。",cue:"快打扫房间！把球都踢出去！",e:"球少一点，场地小一点。",h:"规定必须带球过线，不能直接踢。"},
 es:{n:"Limpia tu cuarto",setup:"Divide el patio a la mitad con conos. Todos los balones en el suelo, la mitad de cada lado.",how:"Dos equipos. Al 'ya', patean los balones de su mitad hacia la otra. Nadie gana. Juegan 90 segundos, descansan y repiten. Más patadas por minuto que cualquier ejercicio.",cue:"¡Limpia tu cuarto! ¡Sácalos de aquí!",e:"Menos balones, área más chica.",h:"Tienen que driblarlo por encima de la línea, no patearlo."}},
s6:{tag:"finish",min:5,
 en:{n:"Score on the goalkeeper",setup:"One goal or two cones six feet apart. You are the goalkeeper.",how:"Kids shoot at you. Dive dramatically the wrong way. Let almost everything in. Celebrate every goal like a final. This is the part they'll remember.",cue:"Oh no — I can't stop you!",e:"Stand still and let them walk it in.",h:"Actually try, once, so a save means something."},
 zh:{n:"射爸爸的门",setup:"一个球门，或者两个标志桶间隔约两米。你当守门员。",how:"孩子对着你射门。你要夸张地扑向完全错误的方向，几乎每个球都放进去。每进一个球都像决赛那样庆祝。这是他们最会记住的一段。",cue:"哎呀 —— 我根本挡不住你！",e:"站着不动，让他们直接带球进门。",h:"认真扑救一次，让“扑到”这件事有点分量。"},
 es:{n:"Anótale al portero",setup:"Una portería o dos conos separados dos metros. Tú eres el portero.",how:"Los niños te disparan. Lánzate dramáticamente hacia el lado equivocado. Deja pasar casi todo. Celebra cada gol como si fuera una final. Esta es la parte que van a recordar.",cue:"¡Ay no — no puedo detenerte!",e:"Quédate quieto y déjalos meterla caminando.",h:"Inténtalo de verdad, una vez, para que atajar signifique algo."}},
s14:{tag:"finish",min:5,
 en:{n:"Two against two",setup:"Tiny field, two small goals, no keepers, no positions.",how:"Just play. Don't coach. Let the ball be a swarm. Stop while it's still fun.",cue:"Go get it!",e:"You join in as a slow, friendly player.",h:"Three against three."},
 zh:{n:"二对二",setup:"很小的场地，两个小球门，没有守门员，没有位置。",how:"就是玩。别指导。让所有人围着球挤成一团也没关系。在还好玩的时候就收。",cue:"快去抢球！",e:"你加进去当一个慢吞吞的友好球员。",h:"改成三对三。"},
 es:{n:"Dos contra dos",setup:"Cancha chiquita, dos porterías pequeñas, sin portero, sin posiciones.",how:"Solo jueguen. No corrijas. Deja que todos persigan el balón en bola. Para mientras todavía es divertido.",cue:"¡Ve por ella!",e:"Métete tú como jugador lento y amigable.",h:"Tres contra tres."}},
s8:{tag:"finish",min:5,
 en:{n:"Three against three",setup:"Small field, two goals, no keepers, no positions.",how:"Full swarm soccer. Every child chases the ball and that is completely correct at this age. Say almost nothing. Cheer everything.",cue:"Go go go!",e:"Two against two, or everyone versus you.",h:"Everyone touches it before scoring — only if they're ready."},
 zh:{n:"三对三",setup:"小场地，两个球门，没有守门员，没有位置。",how:"完全是一窝蜂足球。每个孩子都追着球跑，这个年纪本来就该这样。你几乎什么都别说，什么都鼓掌。",cue:"上上上！",e:"改成二对二，或者所有人一起对你一个。",h:"规定进球前每个人都要碰一次球 —— 只有在他们准备好的时候再加。"},
 es:{n:"Tres contra tres",setup:"Cancha chica, dos porterías, sin portero, sin posiciones.",how:"Fútbol en enjambre total. Todos persiguen el balón y a esta edad eso es completamente correcto. No digas casi nada. Aplaude todo.",cue:"¡Vamos, vamos!",e:"Dos contra dos, o todos contra ti.",h:"Que todos la toquen antes de anotar — solo si ya están listos."}},

/* ---- BASEBALL / T-BALL ---- */
b1:{tag:"warm",min:3,
 en:{n:"Around the bases",setup:"Bases in a small diamond, about ten steps apart.",how:"Everybody jogs the bases in order while you call them: 'FIRST! SECOND! THIRD! HOME!' Three times, faster each round. Base order early saves enormous confusion later.",cue:"First, second, third, HOME!",e:"Walk it once holding hands, touching each base.",h:"Race — you run the wrong way and get lost."},
 zh:{n:"绕垒跑",setup:"四个垒摆成一个小菱形，相邻约十步。",how:"大家按顺序绕垒慢跑，你在旁边喊：“一垒！二垒！三垒！本垒！”跑三轮，一轮比一轮快。早点搞清楚垒的顺序，以后能省下大量混乱。",cue:"一垒、二垒、三垒、本垒！",e:"先牵着手走一圈，每个垒都踩一下。",h:"比赛跑 —— 你故意跑错方向然后迷路。"},
 es:{n:"Vuelta a las bases",setup:"Bases en un diamante chico, a unos diez pasos entre sí.",how:"Todos trotan las bases en orden mientras las cantas: '¡PRIMERA! ¡SEGUNDA! ¡TERCERA! ¡HOME!' Tres vueltas, cada una más rápida. Aprender el orden temprano ahorra muchísima confusión después.",cue:"¡Primera, segunda, tercera, HOME!",e:"Caminen una vuelta de la mano tocando cada base.",h:"Carrera — tú corres al revés y te pierdes."}},
b8:{tag:"warm",min:3,
 en:{n:"Ready position freeze",setup:"Everyone spread out facing you.",how:"Show the ready position: feet apart, knees bent, hands out front. Then play freeze — they jog around, you shout 'READY!', everyone freezes in position. Silly and repeatable.",cue:"Knees bent, hands out, READY!",e:"Just do it standing still together.",h:"Add 'go left' and 'go right' shuffles before the freeze."},
 zh:{n:"预备姿势定格",setup:"大家散开面对你站着。",how:"先示范预备姿势：两脚分开、屈膝、双手放在身前。然后玩定格 —— 他们随意小跑，你喊“预备！”，所有人立刻定住摆好姿势。又傻又能反复玩。",cue:"屈膝、手伸出来、预备！",e:"就一起站着原地做，不跑。",h:"定格之前加上“向左”“向右”的横向滑步。"},
 es:{n:"Congelado en posición",setup:"Todos separados mirándote.",how:"Muestra la posición lista: pies separados, rodillas flexionadas, manos al frente. Luego juega a congelarse — trotan por ahí, gritas '¡LISTOS!' y todos se congelan en posición. Chistoso y repetible.",cue:"¡Rodillas dobladas, manos afuera, LISTOS!",e:"Háganlo parados en el mismo lugar.",h:"Agrega desplazamientos 'a la izquierda' y 'a la derecha' antes de congelarse."}},
b2:{tag:"hit",min:5,
 en:{n:"Tee swings",setup:"Tee at belly-button height. Everyone else has a job.",how:"Ball on tee, three swings each, rotate. The waiting kids are not waiting — second tee, or fielding the hits, or doing ten air swings with you.",cue:"Squish the bug with your back foot!",e:"Lower the tee. Swing with no ball first.",h:"Move the tee inside or outside."},
 zh:{n:"打击架挥棒",setup:"打击架调到肚脐高度。其他孩子都要有事做。",how:"球放架上，每人挥三棒，然后轮换。等着的孩子不能真的干等 —— 要么第二个打击架，要么去接打出来的球，要么和你一起做十次空挥棒。",cue:"后脚碾一碾，像踩虫子一样！",e:"把架子调低。先不放球空挥几次。",h:"把架子往内侧或外侧挪一点。"},
 es:{n:"Swings del tee",setup:"Tee a la altura del ombligo. Todos los demás tienen una tarea.",how:"Pelota en el tee, tres swings cada uno, rotan. Los que esperan no están esperando — segundo tee, o fildeando los batazos, o haciendo diez swings al aire contigo.",cue:"¡Aplasta el bicho con el pie de atrás!",e:"Baja el tee. Primero swings sin pelota.",h:"Mueve el tee hacia adentro o hacia afuera."}},
b3:{tag:"field",min:4,
 en:{n:"Alligator chomp",setup:"Kids in a loose line facing you, five steps away. Soft balls.",how:"Roll a slow grounder to each child. They get low and trap it with two hands coming together like an alligator's mouth. Roll, chomp, throw back, next.",cue:"Chomp it with two hands!",e:"Slower, straight at them.",h:"Roll slightly left or right so they move."},
 zh:{n:"鳄鱼咬球",setup:"孩子松散地排一排面对你，距离五步。用软球。",how:"给每个孩子滚一个慢速地滚球。他们要蹲低，两只手像鳄鱼嘴一样合起来把球夹住。滚球、咬住、扔回来、下一个。",cue:"两只手一起咬住！",e:"滚得更慢，正对着他们滚。",h:"稍微往左或往右滚，让他们要移动一下。"},
 es:{n:"Mordida de cocodrilo",setup:"Niños en fila suelta frente a ti, a cinco pasos. Pelotas blandas.",how:"Ruédale un roletazo lento a cada uno. Se agachan y atrapan con las dos manos juntándose como la boca de un cocodrilo. Rueda, muerde, devuelve, siguiente.",cue:"¡Muérdela con las dos manos!",e:"Más lento y directo hacia ellos.",h:"Ruédala un poco a la izquierda o derecha para que se muevan."}},
b4:{tag:"catch",min:3,
 en:{n:"Popcorn catch",setup:"One child, one soft ball, you three steps away.",how:"Toss gently so it drops into their hands or bucket. Start with a bucket — it builds tracking without fear of hitting fingers. Move to hands when confident.",cue:"Watch it all the way in!",e:"Use a bucket or their shirt held out.",h:"Toss slightly to one side."},
 zh:{n:"爆米花接球",setup:"一个孩子，一个软球，你站在三步远。",how:"轻轻往上抛，让球落进他手里或桶里。先用桶 —— 可以练习盯球，又不怕砸到手指。等他有信心了再改用手接。",cue:"眼睛一直盯着球！",e:"用桶接，或者让他把衣服下摆撑开当兜。",h:"稍微抛偏一点，让孩子要移动一下。"},
 es:{n:"Atrapada de palomitas",setup:"Un niño, una pelota blanda, tú a tres pasos.",how:"Lánzala suave para que caiga en sus manos o en una cubeta. Empieza con cubeta — desarrolla el seguimiento visual sin miedo a los dedos. Pasa a las manos cuando tenga confianza.",cue:"¡Míratela hasta el final!",e:"Usa una cubeta o que estiren la camiseta como canasta.",h:"Lánzala un poco hacia un lado."}},
b11:{tag:"catch",min:3,
 en:{n:"Catch ladder",setup:"Chalk or cones marking three lines: three, five and seven steps out.",how:"Catch three in a row at the first line and move back a line. Miss two and move forward. Everyone finds their own level, and nobody is compared to anyone else.",cue:"Three in a row and you move back!",e:"Start closer than feels necessary.",h:"Add a fourth line."},
 zh:{n:"接球升级线",setup:"用粉笔或标志桶画三条线：三步、五步、七步。",how:"在第一条线连接三个就往后退一条线；连丢两个就往前进一条线。每个人都会停在适合自己的位置，也不用和别人比。",cue:"连接三个就往后退！",e:"起始线定得比你觉得需要的还近一点。",h:"再加一条更远的线。"},
 es:{n:"Escalera de atrapadas",setup:"Gis o conos marcando tres líneas: a tres, cinco y siete pasos.",how:"Atrapa tres seguidas en la primera línea y retrocedes una línea. Falla dos y avanzas una. Cada quien encuentra su nivel y nadie se compara con nadie.",cue:"¡Tres seguidas y te vas para atrás!",e:"Empieza más cerca de lo que parece necesario.",h:"Agrega una cuarta línea."}},
b5:{tag:"throw",min:4,
 en:{n:"Hit the target",setup:"Hula hoop on the ground, or a bucket, six steps away.",how:"Everyone throws at the big target. Big target, short distance, lots of reps. Accuracy comes from confidence, confidence comes from hitting things.",cue:"Point your glove hand at the target, then throw!",e:"Move closer. Any contact counts.",h:"Step back. Bonus point for hitting the bucket on the fly."},
 zh:{n:"扔中目标",setup:"地上放一个呼啦圈，或者一个桶，距离六步。",how:"所有人朝这个大目标扔球。目标大、距离近、次数多。准头来自信心，信心来自“我扔中了”。",cue:"手套那只手指着目标，再扔！",e:"站近一点。碰到就算。",h:"往后退。直接扔进桶里加分。"},
 es:{n:"Pégale al blanco",setup:"Un aro en el suelo, o una cubeta, a seis pasos.",how:"Todos lanzan al blanco grande. Blanco grande, distancia corta, muchas repeticiones. La puntería viene de la confianza, y la confianza viene de atinarle a cosas.",cue:"¡Apunta con la mano del guante y lanza!",e:"Acércate. Cualquier contacto cuenta.",h:"Retrocede. Punto extra si cae dentro de la cubeta."}},
b9:{tag:"combine",min:4,
 en:{n:"Field it and fire",setup:"You roll from home, a bucket sits where first base would be.",how:"Roll a grounder, they chomp it, then throw at the bucket. Two actions in sequence — expect them to forget the throw and just hold the ball, which is normal and fine.",cue:"Chomp it… now throw!",e:"Let them run the ball to the bucket instead of throwing.",h:"Roll it harder or wider."},
 zh:{n:"接住再传",setup:"你从本垒位置滚球，一垒的位置放一个桶。",how:"你滚地滚球，他们“咬”住，然后朝桶扔过去。这是两个连续动作 —— 他们经常会忘了扔、就抱着球站着，很正常，没关系。",cue:"咬住…… 现在扔！",e:"允许他们抱着球跑到桶那儿放进去，不用扔。",h:"滚得快一点，或者滚偏一点。"},
 es:{n:"Fildea y dispara",setup:"Tú ruedas desde home, una cubeta donde estaría primera base.",how:"Ruedas un roletazo, lo muerden y lanzan a la cubeta. Dos acciones seguidas — espera que olviden lanzar y se queden con la pelota, lo cual es normal y está bien.",cue:"Muérdela… ¡ahora lanza!",e:"Déjalos correr con la pelota a la cubeta en vez de lanzar.",h:"Ruédala más fuerte o más abierta."}},
b6:{tag:"game",min:4,
 en:{n:"Beat the ball",setup:"Tee at home, bases out, you in the field.",how:"Child hits and runs to first. You field it and jog — slowly, theatrically — toward first. They always beat you by a hair. Every time.",cue:"Run run run — drop the bat!",e:"Walk to the ball. Take a wrong turn.",h:"Have them run to second."},
 zh:{n:"跑赢球",setup:"本垒放打击架，垒都摆好，你在外场。",how:"孩子击球后跑向一垒。你去捡球，然后夸张地、慢慢地朝一垒小跑。他们每次都以毫厘之差赢你。每一次都是。",cue:"快跑快跑 —— 把棒子放下！",e:"改成走过去捡球，还可以走错方向。",h:"让他们一路跑到二垒。"},
 es:{n:"Gánale a la pelota",setup:"Tee en home, bases puestas, tú en el campo.",how:"El niño batea y corre a primera. Tú fildeas y trotas — lento y teatral — hacia primera. Siempre te ganan por un pelo. Siempre.",cue:"¡Corre corre — suelta el bate!",e:"Camina hacia la pelota. Da una vuelta equivocada.",h:"Que corran hasta segunda."}},
b10:{tag:"combine",min:4,
 en:{n:"Hit and run two",setup:"Tee, bases, you fielding.",how:"Hit off the tee and run to first, then keep going to second. Teaches that running continues past the first base. Everyone else stands at the bases cheering, not fielding.",cue:"Don't stop — keep going!",e:"First base only.",h:"All the way around."},
 zh:{n:"击球跑两个垒",setup:"打击架、垒，你负责接球。",how:"击球后跑到一垒，然后继续跑向二垒。让他们明白到了一垒还要继续跑。其他孩子站在各个垒上加油，不用接球。",cue:"别停 —— 继续跑！",e:"只跑到一垒。",h:"一路跑完全部四个垒。"},
 es:{n:"Batea y corre dos",setup:"Tee, bases, tú fildeando.",how:"Batea del tee y corre a primera, luego sigue a segunda. Enseña que la carrera no termina en primera. Los demás se paran en las bases echando porras, no fildeando.",cue:"¡No pares — sigue!",e:"Solo hasta primera.",h:"La vuelta completa."}},
b12:{tag:"game",min:3,
 en:{n:"Tag the base",setup:"Bases out, everyone at home.",how:"Call a base — 'SECOND!' — and everyone runs to touch it and comes back. Then two bases in order. A running game that quietly drills base recognition.",cue:"Touch it and come back!",e:"Call one base at a time and point.",h:"Call two bases in sequence."},
 zh:{n:"摸到那个垒",setup:"垒都摆好，所有人站在本垒。",how:"喊一个垒 —— “二垒！” —— 所有人跑过去摸一下再跑回来。熟练之后连喊两个垒，按顺序跑。这是个跑动游戏，顺便把垒的位置记牢。",cue:"摸一下就跑回来！",e:"一次只喊一个垒，并且用手指出来。",h:"一次喊两个垒，按顺序跑。"},
 es:{n:"Toca la base",setup:"Bases puestas, todos en home.",how:"Grita una base — '¡SEGUNDA!' — y todos corren a tocarla y regresan. Luego dos bases en orden. Un juego de correr que enseña las bases sin que se note.",cue:"¡Tócala y regresa!",e:"Una base a la vez y señálala con el dedo.",h:"Grita dos bases en secuencia."}},
b13:{tag:"finish",min:5,
 en:{n:"Mini game",setup:"Tee at home, bases out, everyone plays.",how:"Each child hits and runs the bases. No outs, no innings, no score. The others field wherever they like, which will be all together in one clump. That's fine.",cue:"Everybody run!",e:"One base per hit.",h:"Add one real out — but only if losing doesn't hurt yet."},
 zh:{n:"迷你比赛",setup:"本垒放打击架，垒都摆好，所有人一起玩。",how:"每个孩子击球然后跑垒。没有出局、没有局数、不记分。其他人爱守哪儿守哪儿 —— 他们大概会全都挤在同一个地方，没关系。",cue:"大家一起跑！",e:"每次击球只跑一个垒。",h:"加入一个真正的“出局” —— 但只有在输了还不难过的时候才加。"},
 es:{n:"Mini partido",setup:"Tee en home, bases puestas, todos juegan.",how:"Cada niño batea y corre las bases. Sin outs, sin entradas, sin marcador. Los demás fildean donde quieran, que será todos amontonados en el mismo lugar. Está bien así.",cue:"¡Todos a correr!",e:"Una base por batazo.",h:"Agrega un out real — pero solo si perder todavía no duele."}},
b7:{tag:"finish",min:4,
 en:{n:"Home run derby",setup:"Everyone around the tee.",how:"One swing each, everyone cheers for everyone, every hit is announced as a home run wherever it goes. Run the bases with hands in the air. End here.",cue:"IT'S OUTTA HERE!",e:"Nothing to make easier. Every hit is a home run.",h:"Don't."},
 zh:{n:"全垒打大赛",setup:"所有人围在打击架旁边。",how:"每人挥一棒，所有人给所有人鼓掌，不管球打到哪儿都宣布是全垒打。举着双手绕垒跑一圈。每次训练都以这个收尾。",cue:"飞出去啦！",e:"不用再简化了。每一次击球都是全垒打。",h:"别加难度。"},
 es:{n:"Derby de jonrones",setup:"Todos alrededor del tee.",how:"Un swing cada uno, todos aplauden a todos, y cada batazo se anuncia como jonrón vaya donde vaya. Corran las bases con las manos arriba. Termina aquí.",cue:"¡SE VA, SE VA!",e:"Nada que simplificar. Todo batazo es jonrón.",h:"No lo hagas."}},

/* ---- FLAG FOOTBALL ---- */
f1:{tag:"warm",min:4,
 en:{n:"Tail tag",setup:"Everyone in flag belts. Small area marked with cones.",how:"Everyone tries to pull everyone's flags. Yours pulled? Put it back on and keep playing — nobody is out. 60-second bursts. Teaches flag-pulling and running before anyone notices they're learning.",cue:"Grab and pull — put it back on and go!",e:"Bigger area.",h:"Smaller area, or count how many in a minute."},
 zh:{n:"抢尾巴",setup:"每人系一条腰旗带。用标志桶围出一小块场地。",how:"所有人互相抢对方的旗子。自己的被抢走了？装回去继续玩 —— 没有人出局。每轮60秒。孩子还没意识到在学东西，就已经学会了抢旗和跑动。",cue:"抓住，拉！—— 装回去接着跑！",e:"场地划大一点。",h:"场地缩小，或者数一分钟能抢几条。"},
 es:{n:"Atrapa la cola",setup:"Todos con cinturones de flags. Área chica marcada con conos.",how:"Todos intentan quitarle los flags a todos. ¿Te quitaron el tuyo? Póntelo otra vez y sigue — nadie sale. Rondas de 60 segundos. Enseña a quitar flags y a correr antes de que nadie note que está aprendiendo.",cue:"¡Agarra y jala — póntelo y corre!",e:"Área más grande.",h:"Área más chica, o cuenten cuántos en un minuto."}},
f7:{tag:"warm",min:3,
 en:{n:"Flag pull circle",setup:"Kids in belts standing in a circle around you.",how:"You walk around the inside of the circle. When you pass a child they try to pull your flag. Slow, dramatic, everybody wins constantly. Then reverse — you pull theirs as they run past.",cue:"Quick hands — got it!",e:"Move very slowly and telegraph everything.",h:"Jog, and dodge."},
 zh:{n:"围圈抢旗",setup:"孩子们系着腰旗带围成一圈，你站中间。",how:"你沿着圈内侧走。走到谁面前，谁就来抢你的旗子。慢一点、夸张一点，让大家不停地成功。然后反过来 —— 他们跑过去，你去抢他们的。",cue:"手要快 —— 抢到啦！",e:"走得非常慢，动作提前做得很明显。",h:"改成小跑，并且做闪避动作。"},
 es:{n:"Círculo de flags",setup:"Niños con cinturón formando un círculo alrededor de ti.",how:"Caminas por dentro del círculo. Cuando pasas junto a un niño, intenta quitarte el flag. Lento, dramático, todos ganan constantemente. Después al revés — tú les quitas el suyo cuando pasan corriendo.",cue:"¡Manos rápidas — lo tengo!",e:"Muévete muy lento y telegrafía todo.",h:"Trota y esquiva."}},
f2:{tag:"catch",min:4,
 en:{n:"Make a nest",setup:"One child three steps in front of you.",how:"Hands out in front, thumbs together, making a nest. Toss softly right into it. Three steps — much closer than feels right. Back up only when they're catching consistently.",cue:"Make a nest — hands, not tummy!",e:"Hand it to them, or toss from one step.",h:"Back up a step. Toss slightly off-centre."},
 zh:{n:"做一个小窝",setup:"一个孩子站在你前面三步远。",how:"双手伸到身前，两个拇指并拢，像做一个小窝。你轻轻把球抛进那个窝里。就三步 —— 比你觉得应该的距离近得多。等孩子能稳定接住了再往后退。",cue:"做个小窝 —— 用手接，不是用肚子！",e:"直接递到他手里，或者从一步远抛。",h:"往后退一步。抛得稍微偏一点。"},
 es:{n:"Haz un nido",setup:"Un niño a tres pasos frente a ti.",how:"Manos al frente, pulgares juntos, formando un nido. Lanza suave justo ahí. Tres pasos — mucho más cerca de lo que parece correcto. Aléjate solo cuando atrapen consistentemente.",cue:"¡Haz un nido — con las manos, no con la panza!",e:"Dásela en la mano, o lánzala desde un paso.",h:"Retrocede un paso. Lánzala un poco descentrada."}},
f9:{tag:"catch",min:4,
 en:{n:"Catch on the move",setup:"A cone five steps to your right, child starting beside you.",how:"They run to the cone, turn around, and you toss it into their nest. Catching while moving is a real jump in difficulty — expect a low success rate and celebrate the attempts.",cue:"Run, turn, hands ready!",e:"They stop at the cone and get set before you throw.",h:"Toss while they're still running."},
 zh:{n:"跑动中接球",setup:"在你右边五步放一个标志桶，孩子站在你旁边起跑。",how:"他跑到桶那儿，转身，你把球抛进他的“小窝”。移动中接球难度是一个大跳跃 —— 成功率会很低，为每一次尝试鼓掌就好。",cue:"跑、转身、手准备好！",e:"让他跑到桶那儿站稳、摆好姿势，你再抛。",h:"在他还没停下来的时候就抛。"},
 es:{n:"Atrapar en movimiento",setup:"Un cono a cinco pasos a tu derecha, el niño empieza a tu lado.",how:"Corre al cono, se da la vuelta y tú lanzas al nido. Atrapar en movimiento es un salto real de dificultad — espera pocos aciertos y celebra los intentos.",cue:"¡Corre, gira, manos listas!",e:"Que se detengan en el cono y se acomoden antes de lanzar.",h:"Lanza mientras siguen corriendo."}},
f3:{tag:"run",min:4,
 en:{n:"Handoff highway",setup:"Two cones as a gate, an end zone ten steps beyond.",how:"Child runs past you, you hand off into their belly, they run through the gate into the end zone and celebrate. Straight back to the line. No standing.",cue:"Hug the ball — two hands!",e:"Hand it over standing still.",h:"Add a defender — you — reaching for their flag."},
 zh:{n:"交接球通道",setup:"两个标志桶当成一道门，门后十步是达阵区。",how:"孩子从你身边跑过，你把球塞进他怀里，他穿过门冲进达阵区然后庆祝。马上跑回队伍。不许站着。",cue:"把球抱紧 —— 两只手！",e:"站着不动把球递给他。",h:"加一个防守的人 —— 也就是你 —— 伸手去抢旗。"},
 es:{n:"Autopista de entregas",setup:"Dos conos como puerta, una zona de anotación diez pasos más allá.",how:"El niño pasa corriendo junto a ti, le entregas el balón en la panza, cruza la puerta hacia la zona de anotación y celebra. De regreso a la fila enseguida. Nadie parado.",cue:"¡Abraza el balón — dos manos!",e:"Entrégaselo estando parados.",h:"Agrega un defensor — tú — estirándote por su flag."}},
f4:{tag:"run",min:3,
 en:{n:"Weave and score",setup:"Five cones in a line three steps apart, end zone at the end.",how:"Carry the ball, weave through, cross the line, celebrate. Time them if they like numbers. Emphasise hugging the ball the whole way.",cue:"Zigzag — don't drop it!",e:"Fewer cones, wider spacing.",h:"Add a cone they must spin around."},
 zh:{n:"绕桩达阵",setup:"五个标志桶排成一列，间隔三步，尽头是达阵区。",how:"抱着球绕桩跑，冲过线，庆祝。如果孩子喜欢数字可以给他计时。全程强调把球抱紧。",cue:"之字形 —— 别把球掉了！",e:"桶少一点，间距大一点。",h:"加一个必须绕着转一圈的桶。"},
 es:{n:"Zigzag y anota",setup:"Cinco conos en fila a tres pasos, zona de anotación al final.",how:"Carga el balón, zigzaguea, cruza la línea, celebra. Tómales el tiempo si les gustan los números. Insiste en abrazar el balón todo el camino.",cue:"¡Zigzag — no lo sueltes!",e:"Menos conos, más separados.",h:"Agrega un cono alrededor del cual deban girar."}},
f10:{tag:"run",min:3,
 en:{n:"The gauntlet",setup:"Two lines of cones forming a corridor about four steps wide.",how:"Child carries the ball down the corridor while you stand halfway, reaching slowly for the flag. They learn to protect the ball and change speed. Let them through most of the time.",cue:"Two hands on the ball — go past me!",e:"Wider corridor, you reach very slowly.",h:"Narrower, or add a second reacher."},
 zh:{n:"闯关走廊",setup:"用两排标志桶围成一条约四步宽的走廊。",how:"孩子抱着球从走廊冲过去，你站在中间，慢慢伸手去抢他的旗。孩子会学着护球和变速。大部分时候要让他过去。",cue:"两只手抱住球 —— 从我旁边冲过去！",e:"走廊拉宽，你伸手伸得非常慢。",h:"走廊收窄，或者再加一个人伸手。"},
 es:{n:"El pasillo",setup:"Dos hileras de conos formando un pasillo de unos cuatro pasos de ancho.",how:"El niño corre con el balón por el pasillo mientras tú estás a la mitad estirándote lento por el flag. Aprende a proteger el balón y a cambiar de velocidad. Déjalo pasar casi siempre.",cue:"¡Dos manos en el balón — pásame!",e:"Pasillo más ancho, estírate muy lento.",h:"Más angosto, o agrega un segundo defensor."}},
f8:{tag:"combine",min:4,
 en:{n:"Run to the cone",setup:"A cone eight steps downfield.",how:"The first idea of a route: run to the cone and turn around. You throw as they turn. Same play every time until it's automatic — repetition is the point, not variety.",cue:"Run to the cone, turn, catch!",e:"Walk it through once with no ball.",h:"Two cones — they pick which one and you have to guess."},
 zh:{n:"跑到那个桶",setup:"在前方八步放一个标志桶。",how:"这是“跑动路线”最初的概念：跑到桶那儿，转身。他转身的瞬间你把球抛过去。每次都跑同一条路线，一直跑到变成本能 —— 重点是重复，不是花样。",cue:"跑到桶那儿，转身，接球！",e:"先不带球，一起走一遍。",h:"摆两个桶 —— 孩子自己选跑哪个，你来猜。"},
 es:{n:"Corre al cono",setup:"Un cono a ocho pasos hacia adelante.",how:"La primera idea de una ruta: corre al cono y date la vuelta. Lanzas justo cuando gira. La misma jugada siempre hasta que salga sola — el punto es la repetición, no la variedad.",cue:"¡Corre al cono, gira, atrapa!",e:"Camínenlo una vez sin balón.",h:"Dos conos — él elige cuál y tú tienes que adivinar."}},
f5:{tag:"game",min:4,
 en:{n:"Sharks and minnows, flags",setup:"Two lines fifteen steps apart, everyone in belts.",how:"Kids run across while you pull flags. Nobody is out — flag pulled, put it back on, run again from the start. Slow and dramatic.",cue:"Run past me — I'm too slow!",e:"Wider field, move slowly.",h:"Add a second flag-puller."},
 zh:{n:"鲨鱼抓小鱼（腰旗版）",setup:"两条线相距十五步，每人系腰旗带。",how:"孩子从一边跑到另一边，你去抢他们的旗。没有人出局 —— 旗被抢了就装回去，回到起点再跑一次。你要慢，要夸张。",cue:"从我旁边跑过去 —— 我太慢啦！",e:"场地拉宽，你动作放慢。",h:"再加一个抢旗的人。"},
 es:{n:"Tiburones y sardinas con flags",setup:"Dos líneas a quince pasos, todos con cinturón.",how:"Los niños cruzan corriendo mientras tú quitas flags. Nadie sale — te quitan el flag, te lo pones y corres otra vez desde el inicio. Lento y dramático.",cue:"¡Pásame corriendo — soy muy lento!",e:"Campo más ancho, muévete lento.",h:"Agrega un segundo cazador de flags."}},
f11:{tag:"finish",min:5,
 en:{n:"Three against three",setup:"Small field, end zone at each end, everyone in belts.",how:"Every possession ends in a touchdown one way or another. Everyone carries. Invent a celebration dance together and use it every single time.",cue:"TOUCHDOWN! Do the dance!",e:"Two against two, or everyone against you.",h:"One short forward pass per possession."},
 zh:{n:"三对三",setup:"小场地，两端各一个达阵区，每人系腰旗带。",how:"每一次进攻最后都要以达阵收尾，怎么都行。每个孩子都要有持球的机会。和他们一起编一个庆祝舞，每次达阵都跳。",cue:"达阵！跳舞！",e:"改成二对二，或者所有人一起对你一个。",h:"每次进攻允许一次短传。"},
 es:{n:"Tres contra tres",setup:"Campo chico, zona de anotación en cada extremo, todos con cinturón.",how:"Cada posesión termina en touchdown de una forma u otra. Todos cargan el balón. Inventen juntos un baile de celebración y úsenlo siempre.",cue:"¡TOUCHDOWN! ¡A bailar!",e:"Dos contra dos, o todos contra ti.",h:"Un pase corto hacia adelante por posesión."}},
f6:{tag:"finish",min:5,
 en:{n:"Everybody scores",setup:"Small field, one end zone.",how:"Each child gets the ball, runs, and scores while you chase theatrically behind. Full celebration required. End here every time.",cue:"Go go go — TOUCHDOWN!",e:"Shorter run.",h:"Actually try to pull the flag — sometimes."},
 zh:{n:"人人都达阵",setup:"小场地，一个达阵区。",how:"每个孩子都拿球跑一次并达阵，你在后面夸张地追。必须庆祝。每次训练都用这个收尾。",cue:"跑跑跑 —— 达阵！",e:"距离缩短。",h:"偶尔真的去抢一次旗。"},
 es:{n:"Todos anotan",setup:"Campo chico, una zona de anotación.",how:"Cada niño toma el balón, corre y anota mientras tú persigues teatralmente por detrás. Celebración obligatoria. Termina siempre con esto.",cue:"¡Corre corre — TOUCHDOWN!",e:"Distancia más corta.",h:"Intenta quitarle el flag de verdad — a veces."}}
};
Object.assign(D,MOVE);


/* ============ BASKETBALL DRILLS ============ */
Object.assign(D,{
k1:{tag:"warm",min:3,
 en:{n:"Bounce and catch",setup:"Everyone with a ball, standing in a loose circle.",how:"Push the ball down with two hands, let it bounce once, catch it. Then two bounces. Then bounce it and clap before catching. Change the challenge every 20 seconds. Two hands throughout — one-handed dribbling is years away.",cue:"Push it down — catch it with two hands!",e:"Drop the ball instead of pushing, or let it bounce twice before catching.",h:"Bounce, spin around, then catch."},
 zh:{n:"拍球接球",setup:"每人一个球，围成一个松散的圈站着。",how:"双手把球往下压，让它弹一下，再接住。然后弹两下。然后拍完拍一下手再接。每20秒换一个花样。全程用两只手 —— 单手运球是好几年以后的事。",cue:"往下压 —— 两只手接住！",e:"改成把球放掉而不是用力压，或者让它弹两下再接。",h:"拍一下，原地转个圈，再接住。"},
 es:{n:"Bota y atrapa",setup:"Cada uno con su balón, en un círculo suelto.",how:"Empuja el balón hacia abajo con las dos manos, deja que rebote una vez y atrápalo. Luego dos rebotes. Luego rebota y aplaude antes de atrapar. Cambia el reto cada 20 segundos. Siempre con dos manos — driblar con una está a años de distancia.",cue:"¡Empújalo abajo — atrápalo con dos manos!",e:"Que lo suelten en vez de empujarlo, o que rebote dos veces antes de atrapar.",h:"Rebota, da una vuelta y atrapa."}},
k2:{tag:"warm",min:3,
 en:{n:"Ball wake-up",setup:"Everyone with a ball, plenty of space.",how:"Pass the ball around your waist. Then around your head. Then between your knees. Then hold it high and drop it into your own hands. Silly, quick, and it teaches the hands where the ball is without a single word about technique.",cue:"Around your tummy — now your head!",e:"Just hold it and lift it overhead and down.",h:"Around one leg, then the other, in a figure eight."},
 zh:{n:"叫醒球感",setup:"每人一个球，留出足够空间。",how:"把球绕着腰传一圈。然后绕头。然后从两腿之间穿过去。然后举高，让它掉进自己手里。又快又傻，而且一个技术词都不用讲，手就自己学会球在哪儿了。",cue:"绕着肚子 —— 现在绕头！",e:"就抱着球举过头顶再放下来。",h:"绕一条腿，再绕另一条，绕成八字形。"},
 es:{n:"Despertar el balón",setup:"Cada uno con su balón, con espacio de sobra.",how:"Pasa el balón alrededor de la cintura. Luego alrededor de la cabeza. Luego entre las rodillas. Luego sostenlo alto y déjalo caer en tus propias manos. Rápido y chistoso, y le enseña a las manos dónde está el balón sin decir una palabra de técnica.",cue:"¡Alrededor de la panza — ahora de la cabeza!",e:"Solo que lo levanten por encima de la cabeza y lo bajen.",h:"Alrededor de una pierna, luego la otra, en forma de ocho."}},
k3:{tag:"control",min:4,
 en:{n:"Standing dribble",setup:"Everyone with a ball, standing still, well spread out.",how:"Dribble in place with two hands, then one, counting out loud together. Ten dribbles, rest, twenty dribbles. The ball will get away constantly — that is the drill, not a failure of it.",cue:"Push, don't slap! Fingers, not palms.",e:"Two hands, and let them catch it whenever they need to.",h:"Dribble with eyes up looking at you, or switch hands on your call."},
 zh:{n:"原地运球",setup:"每人一个球，站着不动，彼此拉开距离。",how:"原地运球，先两只手，再单手，一起大声数数。运十下、休息、再运二十下。球会不停地跑掉 —— 这就是练习本身，不是失败。",cue:"是往下压，不是拍！用手指，别用手掌。",e:"用两只手，随时想接住就接住。",h:"抬头看着你运球，或者听你的口令换手。"},
 es:{n:"Bote en el lugar",setup:"Cada uno con su balón, parados y bien separados.",how:"Botan en el mismo lugar con las dos manos, luego con una, contando en voz alta juntos. Diez botes, descanso, veinte botes. El balón se les escapará constantemente — eso es el ejercicio, no un fracaso.",cue:"¡Empuja, no golpees! Con los dedos, no con la palma.",e:"Con las dos manos, y que lo atrapen cuando lo necesiten.",h:"Que boten con la vista arriba mirándote, o que cambien de mano a tu señal."}},
k4:{tag:"control",min:4,
 en:{n:"Red light, green light",setup:"Everyone with a ball on one line, you about ten steps away.",how:"Green light means walk toward you while dribbling. Red light means catch the ball and freeze holding it. Nobody goes back for mistakes. High five at the end, run back, go again.",cue:"Catch it and FREEZE!",e:"Let them carry the ball and just bounce it once per step.",h:"Add yellow light for slow-motion dribbling."},
 zh:{n:"红灯绿灯",setup:"每人一个球站在一条线上，你在十步开外。",how:"绿灯就一边运球一边朝你走，红灯就把球接住抱在手里定住。做错了也不用退回去。到终点击掌，跑回去再来一轮。",cue:"接住，定住！",e:"允许他们抱着球走，每走一步拍一下。",h:"加一个黄灯，表示慢动作运球。"},
 es:{n:"Luz roja, luz verde",setup:"Todos con balón en una línea, tú a unos diez pasos.",how:"Luz verde: caminan hacia ti botando. Luz roja: atrapan el balón y se congelan sosteniéndolo. Nadie regresa por equivocarse. Choca los cinco al final, corran de regreso y otra vez.",cue:"¡Atrápalo y CONGÉLATE!",e:"Que carguen el balón y solo lo boten una vez por paso.",h:"Agrega luz amarilla para botar en cámara lenta."}},
k11:{tag:"control",min:4,
 en:{n:"Cone weave dribble",setup:"Five cones in a line, four steps apart.",how:"Dribble through the cones and back. Walking is fine — running while dribbling is genuinely hard at four. Count how many cones you got past before losing the ball, and try to beat it.",cue:"Walk and bounce — take your time!",e:"Wider spacing, and let them carry the ball between bounces.",h:"Move the cones closer, or ask for one bounce between each cone."},
 zh:{n:"绕桶运球",setup:"五个标志桶排成一列，间隔四步。",how:"运球绕过所有桶再回来。走着做完全可以 —— 四岁边跑边运球是真的难。数一数丢球之前过了几个桶，然后想办法超过这个数。",cue:"慢慢走，慢慢拍 —— 不着急！",e:"桶的间距拉大，允许他们在两次拍球之间抱着球走。",h:"桶靠近一些，或者要求每两个桶之间必须拍一下。"},
 es:{n:"Zigzag botando",setup:"Cinco conos en fila, a cuatro pasos.",how:"Botan entre los conos y regresan. Caminar está bien — botar corriendo es genuinamente difícil a los cuatro. Cuenten cuántos conos pasaron antes de perder el balón e intenten superarlo.",cue:"¡Camina y bota — sin prisa!",e:"Más separación, y que puedan cargar el balón entre botes.",h:"Acerca los conos, o pide un bote entre cada cono."}},
k6:{tag:"shoot",min:5,
 en:{n:"Shoot at the low hoop",setup:"Hoop set to four or five feet — much lower than feels right. Everyone lines up loosely, no waiting.",how:"Two-handed underhand shot from close range: ball at the chest, push up and out. Chase your own rebound, come back, shoot again. Nobody waits their turn — everyone shoots continuously.",cue:"Push it UP, not forward!",e:"Lower the hoop further, or move a step closer. Any ball touching the rim counts.",h:"Step back one pace, or call out a spot to shoot from."},
 zh:{n:"投低篮筐",setup:"篮筐调到约1.2–1.5米高 —— 比你觉得合适的还要低得多。大家松散地排着，不许干等。",how:"近距离双手下手投篮：球放在胸前，往上往外推。自己去抢自己的篮板，跑回来再投。不用轮流 —— 所有人一直在投。",cue:"往上推，不是往前扔！",e:"篮筐再调低一点，或者往前站一步。球碰到篮筐就算数。",h:"往后退一步，或者指定一个投篮位置。"},
 es:{n:"Tira al aro bajo",setup:"Aro a 1.2–1.5 metros — mucho más bajo de lo que parece correcto. Todos en fila suelta, sin esperar.",how:"Tiro con dos manos desde abajo y cerca: balón al pecho, empuja hacia arriba y afuera. Cada quien persigue su propio rebote, regresa y tira otra vez. Nadie espera turno — todos tiran continuamente.",cue:"¡Empújalo ARRIBA, no hacia adelante!",e:"Baja más el aro, o que se acerquen un paso. Cualquier balón que toque el aro cuenta.",h:"Un paso atrás, o canta desde qué punto tirar."}},
k7:{tag:"shoot",min:4,
 en:{n:"Knock the ball off the cone",setup:"Balls balanced on top of tall cones, six steps from a throwing line.",how:"Throw or shoot to knock the balls off the cones. Reset endlessly. This builds the same upward pushing motion as shooting, but with a target that gives an obvious, satisfying result every time.",cue:"Push it up and out!",e:"Move the line closer, or use bigger targets.",h:"Step back, or make it a two-handed overhead throw."},
 zh:{n:"打掉桶上的球",setup:"把球平衡地放在高标志桶顶上，离投掷线约六步。",how:"投球把桶上的球打下来。不停地摆回去重来。这个练的是和投篮一样的向上推的动作，但目标每次都会给出明显又过瘾的反馈。",cue:"往上、往外推！",e:"投掷线往前挪，或者用更大的目标。",h:"往后退，或者改成双手过头投。"},
 es:{n:"Tumba el balón del cono",setup:"Balones equilibrados encima de conos altos, a seis pasos de una línea de tiro.",how:"Lanzan o tiran para tumbar los balones de los conos. Reacomoda sin parar. Trabaja el mismo empuje hacia arriba que el tiro, pero con un blanco que da un resultado obvio y satisfactorio cada vez.",cue:"¡Empújalo arriba y afuera!",e:"Acerca la línea, o usa blancos más grandes.",h:"Retrocede, o que sea un lanzamiento con dos manos por encima de la cabeza."}},
k8:{tag:"pass",min:3,
 en:{n:"Bounce pass",setup:"Face your child, four steps apart. One ball.",how:"Push the ball with two hands so it bounces once between you and arrives at their chest. A bounce pass is far easier to catch than a chest pass at this age — the bounce slows the ball down and makes it predictable.",cue:"Bounce it halfway to me!",e:"Roll it along the ground first.",h:"Step back a pace, or count how many you can do without a miss."},
 zh:{n:"击地传球",setup:"和孩子面对面，相距四步。一个球。",how:"双手把球推出去，让它在你们中间弹一下，正好到达对方胸前。这个年纪，击地传球比胸前直传好接得多 —— 弹一下会让球慢下来，也更好预判。",cue:"弹在我们中间！",e:"先改成沿地面滚过去。",h:"往后退一步，或者数数能连续接住几个。"},
 es:{n:"Pase de pique",setup:"Frente a tu hijo o hija, a cuatro pasos. Un balón.",how:"Empuja el balón con las dos manos para que rebote una vez entre ustedes y llegue a la altura del pecho. Un pase de pique es mucho más fácil de atrapar que uno directo a esta edad — el rebote frena el balón y lo hace predecible.",cue:"¡Que rebote a la mitad del camino!",e:"Primero ruédalo por el suelo.",h:"Retrocede un paso, o cuenten cuántos hacen sin fallar."}},
k9:{tag:"combine",min:4,
 en:{n:"Dribble then shoot",setup:"Start line about six steps from the low hoop.",how:"Dribble to the hoop — walking is fine — then pick the ball up and shoot. Two actions in a row is a real step at four, so expect a lot of forgetting to dribble, or forgetting to shoot. Cheer either way.",cue:"Bounce, bounce… now SHOOT!",e:"Drop the dribble; just walk in and shoot.",h:"Start further back, or add a cone to go around first."},
 zh:{n:"运球再投篮",setup:"起始线离低篮筐约六步。",how:"运球走到篮下 —— 走着做就行 —— 然后把球拿起来投篮。四岁能把两个动作连起来是一个真正的台阶，所以经常会忘了运球，或者忘了投篮。不管怎样都鼓掌。",cue:"拍、拍…… 投！",e:"不要求运球，直接走过去投。",h:"起点往后退，或者中间加一个要绕过的桶。"},
 es:{n:"Bota y tira",setup:"Línea de salida a unos seis pasos del aro bajo.",how:"Botan hasta el aro — caminando está bien — luego levantan el balón y tiran. Dos acciones seguidas es un paso real a los cuatro, así que espera que olviden botar, o que olviden tirar. Aplaude en ambos casos.",cue:"Bota, bota… ¡ahora TIRA!",e:"Quita el bote; que solo caminen y tiren.",h:"Empieza más atrás, o agrega un cono que deban rodear primero."}},
k10:{tag:"game",min:4,
 en:{n:"Sharks and minnows",setup:"Two lines about twelve steps apart. Kids on one line with a ball each. You in the middle.",how:"Kids dribble across while you try to tap their ball away. Nobody is out — lose your ball, chase it, come back and go again. Be a comically slow shark.",cue:"Keep it low — protect the ball!",e:"Wider area, move very slowly.",h:"Narrower area, or add a second shark."},
 zh:{n:"鲨鱼抓小鱼",setup:"两条线相距约十二步。孩子站在一条线上，每人一个球。你站中间。",how:"孩子一边运球一边穿过去，你想办法把他们的球拍走。没有人出局 —— 球丢了就去追，回来再来一次。你要当一条慢得很搞笑的鲨鱼。",cue:"压低一点 —— 保护好球！",e:"场地拉宽，你动作放得很慢。",h:"场地收窄，或者再加一条鲨鱼。"},
 es:{n:"Tiburones y sardinas",setup:"Dos líneas a unos doce pasos. Los niños en una línea, cada uno con balón. Tú en medio.",how:"Cruzan botando mientras tú intentas manotearles el balón. Nadie sale — si pierdes el balón, ve por él, regresa y otra vez. Sé un tiburón cómicamente lento.",cue:"¡Bajito — protege el balón!",e:"Área más ancha, muévete muy lento.",h:"Área más angosta, o agrega un segundo tiburón."}},
k14:{tag:"finish",min:5,
 en:{n:"Score on the coach",setup:"Low hoop. You stand under it as a hopeless defender.",how:"Kids come one at a time and shoot while you wave your arms in entirely the wrong places, trip over nothing, and let almost everything in. Celebrate every basket enormously. This is the part they'll talk about at dinner.",cue:"Oh no — you're too good for me!",e:"Stand still with your hands down.",h:"Actually block one — once — so beating you means something."},
 zh:{n:"投爸爸的篮",setup:"低篮筐。你站在篮下当一个毫无用处的防守者。",how:"孩子一个一个上来投篮，你在完全不相干的方向乱挥手、无缘无故绊自己一跤、几乎什么都拦不住。每进一个球都要夸张地庆祝。这是他们晚饭时会讲的那一段。",cue:"哎呀 —— 你太厉害了我拦不住！",e:"站着不动，手放下来。",h:"认真拦一次 —— 就一次 —— 让“过掉你”这件事有分量。"},
 es:{n:"Anótale al entrenador",setup:"Aro bajo. Tú debajo, como defensor inútil.",how:"Los niños pasan de uno en uno y tiran mientras tú agitas los brazos en el lugar completamente equivocado, te tropiezas con nada y dejas pasar casi todo. Celebra cada canasta enormemente. Esta es la parte que van a contar en la cena.",cue:"¡Ay no — eres demasiado bueno para mí!",e:"Quédate quieto con las manos abajo.",h:"Bloquea uno de verdad — una sola vez — para que ganarte signifique algo."}},
k12:{tag:"finish",min:4,
 en:{n:"Everybody scores",setup:"Low hoop, everyone gathered around.",how:"One shot each, everyone cheers for everyone, and keep going around the circle until every child has made at least one. Lower the hoop or move them closer as needed — the round doesn't end until everyone has scored. End here.",cue:"IT'S IN! Everybody clap!",e:"Move them close enough that it cannot fail.",h:"Don't."},
 zh:{n:"人人都进球",setup:"低篮筐，大家围在旁边。",how:"每人投一次，所有人给所有人鼓掌，一圈一圈转下去，直到每个孩子都至少进过一个。需要的话就把篮筐再调低，或者让他们站得更近 —— 这一轮不结束，直到人人都进球。每次训练都以这个收尾。",cue:"进啦！大家鼓掌！",e:"让他们站到近得不可能投不进的位置。",h:"别加难度。"},
 es:{n:"Todos anotan",setup:"Aro bajo, todos alrededor.",how:"Un tiro cada uno, todos aplauden a todos, y sigan dando vueltas hasta que cada niño haya encestado al menos una. Baja el aro o acércalos según haga falta — la ronda no termina hasta que todos anoten. Termina aquí.",cue:"¡ENTRÓ! ¡Todos a aplaudir!",e:"Acércalos tanto que sea imposible fallar.",h:"No lo hagas."}},
k13:{tag:"finish",min:5,
 en:{n:"Two against two",setup:"One low hoop, both teams shoot at the same one. No out of bounds, no fouls, no score.",how:"Just play. Everyone will hold the ball with two hands and run, which is travelling and which you should completely ignore. Stop while it's still fun.",cue:"Go get it — shoot it!",e:"Everyone against you, all shooting at one hoop.",h:"Three against three, or add the rule that you must bounce it once before shooting."},
 zh:{n:"二对二",setup:"一个低篮筐，两队都投同一个筐。没有界外、没有犯规、不记分。",how:"就是玩。每个孩子都会两手抱着球跑，这在正式规则里是走步 —— 完全不用管。在还好玩的时候就收。",cue:"去抢球 —— 投！",e:"所有人一起对你一个，都投同一个筐。",h:"改成三对三，或者加一条规则：投篮前必须先拍一下球。"},
 es:{n:"Dos contra dos",setup:"Un solo aro bajo, ambos equipos tiran al mismo. Sin fuera de banda, sin faltas, sin marcador.",how:"Solo jueguen. Todos van a agarrar el balón con las dos manos y correr, lo cual es pasos y lo cual deberías ignorar por completo. Para mientras todavía es divertido.",cue:"¡Ve por él — tira!",e:"Todos contra ti, tirando al mismo aro.",h:"Tres contra tres, o agrega que deben botar una vez antes de tirar."}}
});
